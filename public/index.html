<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>QA Powerhouse · One Platform for Compliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1D24; --ink-2:#3D4551; --muted:#6B7686; --faint:#A2ABB8;
    --paper:#F6F7FB; --card:#FFFFFF; --line:#E6E9F0; --line-2:#F0F2F7;
    --brand:#E4002B; --brand-ink:#C10024; --gold:#FFC400; --gold-ink:#E5A800;
    --ov:#DC2626; --cr:#EA580C; --wa:#CA8A04; --wt:#2563EB; --ok:#16A34A; --nt:#94A3B8;
    --ov-bg:#FEECEC; --cr-bg:#FEEEE3; --wa-bg:#FBF3D6; --wt-bg:#E8F0FE; --ok-bg:#E6F6EC; --nt-bg:#EFF2F6;
    --shadow:0 1px 2px rgba(20,24,31,.05),0 6px 22px rgba(20,24,31,.05);
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--paper);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.disp{font-family:'Space Grotesk','Inter',sans-serif;letter-spacing:-.01em}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:var(--wt)}
  .hide{display:none !important}

  /* ---------- Login ---------- */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:
    linear-gradient(140deg,#FFF7EA 0%,#FDEEF0 100%);padding:24px}
  .login-card{width:100%;max-width:380px;background:var(--card);border-radius:16px;position:relative;overflow:hidden;box-shadow:0 18px 50px rgba(228,0,43,.14),0 2px 8px rgba(0,0,0,.06);padding:32px 30px;animation:rise .5s cubic-bezier(.2,.7,.2,1)}
  .login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--brand),var(--gold))}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .brand-mark{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .brand-dot{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:700;font-family:'Space Grotesk'}
  .brand-name{font-weight:700;font-size:15px;font-family:'Space Grotesk'}
  .brand-sub{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .brand-logo{display:block;height:32px;width:auto}
  .brand-chip{background:#fff;border-radius:8px;padding:6px 8px;display:inline-flex;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .login-card h1{font-size:22px;margin-bottom:4px}
  .login-card p.lead{color:var(--muted);font-size:13px;margin-bottom:22px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;transition:border .15s,box-shadow .15s}
  .datewrap{position:relative}
  .datewrap .date-show{width:100%;padding:10px 36px 10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14px;color:var(--ink);min-height:40px;line-height:20px}
  .datewrap .date-show.ph{color:var(--faint)}
  .datewrap .date-ic{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  .datewrap .date-over{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--wt);box-shadow:0 0 0 3px var(--wt-bg)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:9px;font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}
  .btn-primary{background:var(--brand);color:#fff;width:100%}
  .btn-primary:hover{background:var(--brand-ink)}
  .btn-primary:disabled{opacity:.5;cursor:default}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
  .btn-ghost:hover{border-color:var(--faint);background:var(--line-2)}
  .btn-danger{background:var(--ov-bg);color:var(--ov)}
  .btn-danger:hover{background:#fbdcdc}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px}
  .msg{font-size:12.5px;padding:9px 11px;border-radius:8px;margin-top:4px}
  .msg.err{background:var(--ov-bg);color:var(--brand-ink)}
  .msg.ok{background:var(--ok-bg);color:#0f7a37}

  /* ---------- App shell ---------- */
  #app{display:grid;grid-template-columns:auto 1fr;min-height:100vh}
  #app.side-collapsed .side{width:0;border-right-color:transparent}
  .side-collapse{position:absolute;top:14px;right:10px;width:26px;height:26px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;background:#fff;color:var(--muted);cursor:pointer;z-index:2}
  .side-collapse:hover{color:var(--brand);border-color:var(--brand)}
  .side-expand{position:fixed;left:12px;top:14px;width:34px;height:34px;border:1px solid var(--line);border-radius:9px;display:none;place-items:center;background:#fff;color:var(--brand);cursor:pointer;z-index:38;box-shadow:var(--shadow)}
  #app.side-collapsed .side-expand{display:grid}
  .side{background:#fff;color:var(--ink-2);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);width:236px;overflow:hidden;transition:width .2s ease}
  .side::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--gold));z-index:1}
  .side .brand-mark{padding:18px 42px 14px 18px;margin:0;border-bottom:1px solid var(--line);position:relative}
  .side .brand-name{color:var(--ink);font-size:14.5px;line-height:1.15}.side .brand-sub{color:var(--muted);font-size:10px;letter-spacing:.01em;text-transform:none;line-height:1.3}
  .nav{padding:12px 10px;flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.18) transparent}
  .nav::-webkit-scrollbar{width:6px}
  .nav::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:3px}
  .nav::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.28)}
  .nav::-webkit-scrollbar-track{background:transparent}
  .nav-group{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px;font-weight:700}
  .nav a{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;color:var(--ink-2);font-size:12.5px;font-weight:500;text-decoration:none;transition:.12s;margin-bottom:0}
  .nav a:hover{background:#FFF6E0;color:var(--ink)}
  .nav a.active{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(228,0,43,.28)}
  .nav a .ic{width:15px;height:15px;flex:none;opacity:.85}
  .nav a.active .ic{opacity:1}
  .nav .badge{margin-left:auto;background:var(--line-2);color:var(--muted);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px;min-width:18px;text-align:center}
  .nav a.active .badge{background:rgba(0,0,0,.22)}
  .nav-parent{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;color:var(--ink-2);font-size:12.5px;font-weight:500;transition:.12s;margin-bottom:0}
  .nav-parent:hover{background:#FFF6E0;color:var(--ink)}
  .nav-parent .ic{width:15px;height:15px;flex:none;opacity:.85}
  .nav-parent .chev{margin-left:auto;transition:transform .2s;opacity:.65}
  .nav-parent.open .chev{transform:rotate(90deg);opacity:1}
  .nav-sub{overflow:hidden;max-height:240px;transition:max-height .22s ease}
  .nav-sub.collapsed{max-height:0}
  .nav a.sub{padding-left:32px;font-size:12px}
  .nav .badge.alert{background:var(--ov);color:#fff}
  .side-foot{padding:12px;border-top:1px solid var(--line);font-size:12px}
  .side-foot .who{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
  .side-foot .nm{font-weight:600;color:var(--ink);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-foot .rl{color:var(--muted);font-size:11px}
  .side-foot button{width:100%;color:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:7px;font-size:12px;font-weight:600;background:#fff}
  .side-foot button:hover{background:#FFF6E0;color:var(--ink)}

  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{display:none}
  .content{padding:26px 40px 64px;width:100%;margin:0}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .page-head h1{font-size:24px}
  .page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .page-actions{display:flex;gap:8px;flex-wrap:wrap}

  /* ---------- Dashboard ---------- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .tile .k{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
  .tile .v{font-family:'Space Grotesk';font-size:30px;font-weight:700;margin-top:8px;line-height:1}
  .tile .meta{font-size:11.5px;color:var(--faint);margin-top:5px}
  .tile .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
  .tile.clickable{cursor:pointer;transition:box-shadow .15s,transform .1s,border-color .15s}
  .tile.clickable:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-1px)}
  .tile.active{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
  .tile .chev{position:absolute;right:12px;bottom:11px;font-size:11px;color:var(--faint)}
  .swatch{width:9px;height:9px;border-radius:3px;display:inline-block}
  .dot-ov{background:var(--ov)}.dot-cr{background:var(--cr)}.dot-wa{background:var(--wa)}.dot-wt{background:var(--wt)}.dot-ok{background:var(--ok)}
  .bar-ov{background:var(--ov)}.bar-cr{background:var(--cr)}.bar-wa{background:var(--wa)}.bar-ok{background:var(--ok)}.bar-nt{background:var(--nt)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line-2);gap:12px;flex-wrap:wrap}
  .panel-head h2{font-size:15px}
  .panel-head .hint{font-size:12px;color:var(--muted)}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .search{position:relative;flex:1;min-width:180px;max-width:340px}
  .search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .search input:focus{outline:none;border-color:var(--wt);box-shadow:0 0 0 3px var(--wt-bg)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
  .toolbar select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink-2);font-weight:500}
  .toolbar .spacer{flex:1}
  .count-chip{font-size:12px;color:var(--muted);font-weight:500}

  /* ---------- Table ---------- */
  .table-wrap{overflow:auto;max-height:calc(100vh - 210px);border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
  thead th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:11px 14px;border-bottom:1px solid var(--line);background:#FAFBFE;position:sticky;top:0;z-index:5;cursor:pointer;user-select:none;box-shadow:0 1px 0 var(--line)}
  thead th .arr{opacity:.4;font-size:9px;margin-left:3px}
  thead th.sorted .arr{opacity:1}
  thead th.nosort{cursor:default}
  .th-in{display:inline-flex;align-items:center;gap:4px}
  .th-sort{display:inline-flex;align-items:center;cursor:pointer}
  .th-funnel{border:none;background:none;padding:2px;margin:0;cursor:pointer;color:var(--faint);border-radius:4px;display:inline-flex;line-height:0}
  .th-funnel:hover{color:var(--brand);background:#fff0f0}
  .th-funnel.on{color:var(--brand)}
  .th-funnel.on svg{fill:var(--brand)}
  .colfilter-pop{position:absolute;z-index:60;width:240px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px;font-size:13px}
  .cfp-head{font-weight:700;font-size:12px;margin-bottom:8px;text-transform:none;color:var(--ink)}
  .cfp-search{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;margin-bottom:6px}
  .cfp-all{display:flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;padding:4px 2px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .cfp-list{max-height:220px;overflow:auto;display:flex;flex-direction:column}
  .cfp-item{display:flex;align-items:center;gap:7px;padding:4px 2px;cursor:pointer;text-transform:none;font-weight:400;color:var(--ink)}
  .cfp-item:hover{background:var(--wt-bg)}
  .cfp-item span:first-of-type{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cfp-count{color:var(--faint);font-size:11px}
  .cfp-foot{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
  .moc-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:2px solid var(--line)}
  .moc-tabs button{border:none;background:none;padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;border-radius:6px 6px 0 0}
  .moc-tabs button:hover{color:var(--ink);background:var(--wt-bg)}
  .moc-tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
  .moc-body{padding:20px}
  .moc-h{font-size:14px;font-weight:700;color:var(--brand);margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .moc-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
  .moc-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .moc-body .fld{margin-bottom:12px}
  .moc-body .fld>label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin-bottom:5px}
  .moc-in{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff;margin-bottom:5px}
  .moc-in:focus{outline:none;border-color:var(--brand)}
  textarea.moc-in{resize:vertical;line-height:1.5}
  .moc-cbcol{display:flex;flex-direction:column;gap:5px}
  .moc-cb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);text-transform:none;font-weight:400}
  .moc-cb input{width:15px;height:15px;flex:none}
  .moc-cb .moc-in{margin:0;flex:1;padding:4px 8px}
  .moc-tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
  .moc-tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
  .moc-tbl th{background:var(--wt-bg);padding:8px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
  .moc-tbl td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top}
  .moc-tbl td.c{text-align:center;vertical-align:middle}
  .moc-tbl .moc-in{margin:0;min-width:80px}
  .moc-delrow{border:none;background:none;color:var(--faint);cursor:pointer;font-size:14px;padding:4px 6px;border-radius:5px}
  .moc-delrow:hover{color:var(--brand);background:#fff0f0}
  .moc-tbl select.moc-rate{cursor:pointer;border-radius:6px}
  .moc-yesno{display:flex;gap:14px;justify-content:center;align-items:center;white-space:nowrap}
  .moc-yesno label{display:inline-flex;align-items:center;gap:4px;font-size:12px;cursor:pointer}
  .moc-yesno input{width:14px;height:14px}
  .moc-tbl td.moc-ro{font-size:12px;color:var(--ink-2);white-space:pre-line;min-width:150px;background:var(--wt-bg)}
  .moc-guide{font-size:12.5px;color:var(--brand);text-decoration:none;font-weight:600;white-space:nowrap}
  .moc-guide:hover{text-decoration:underline}
  .moc-hgroup{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:var(--wt-bg)}
  .moc-hgtitle{font-weight:700;font-size:13px;color:var(--ink);margin-bottom:8px}
  .moc-hgroup .moc-tblwrap{background:#fff}
  .guide-tbl,.guide-matrix{width:100%;border-collapse:collapse;font-size:12px}
  .guide-tbl th,.guide-tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  .guide-tbl th{background:var(--wt-bg);font-weight:700}
  .guide-tbl td.c{text-align:center;font-weight:700}
  .guide-matrix th,.guide-matrix td{border:1px solid #999;padding:7px;text-align:center;font-size:12px}
  .guide-matrix th{background:var(--wt-bg);font-weight:700}
  .guide-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px}
  .guide-legend span{display:flex;align-items:center;gap:6px}
  .guide-legend i{width:16px;height:12px;border-radius:2px;display:inline-block}
  @media(max-width:760px){.moc-grid2,.moc-grid3{grid-template-columns:1fr}}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#FEF7F8}
  td.wrap{white-space:normal;min-width:200px;max-width:340px;color:var(--ink-2)}
  td.name{font-weight:600;white-space:normal;min-width:170px;max-width:300px}
  .row-actions{display:flex;gap:5px;justify-content:flex-end}
  .icon-btn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
  .icon-btn:hover{background:var(--line-2);color:var(--ink)}
  .icon-btn.del:hover{background:var(--ov-bg);color:var(--ov)}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .pill .swatch{width:6px;height:6px}
  .st-overdue{background:var(--ov-bg);color:var(--ov)} .st-overdue .swatch{background:var(--ov)}
  .st-critical{background:var(--cr-bg);color:var(--cr)} .st-critical .swatch{background:var(--cr)}
  .st-warning{background:var(--wa-bg);color:#92660a} .st-warning .swatch{background:var(--wa)}
  .st-watch{background:var(--wt-bg);color:var(--wt)} .st-watch .swatch{background:var(--wt)}
  .st-ok{background:var(--ok-bg);color:#0f7a37} .st-ok .swatch{background:var(--ok)}
  .st-none{background:var(--nt-bg);color:var(--muted)} .st-none .swatch{background:var(--nt)}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--line-2);color:var(--ink-2)}
  .tag.green{background:var(--ok-bg);color:#0f7a37}.tag.red{background:var(--ov-bg);color:var(--ov)}.tag.blue{background:var(--wt-bg);color:var(--wt)}.tag.gray{background:var(--nt-bg);color:var(--muted)}.tag.amber{background:#fef3c7;color:#92600a}
  .rate-dots{display:flex;gap:3px}
  .rdot{width:7px;height:7px;border-radius:2px;background:var(--line)}
  .rdot.on{background:var(--ok)}
  .ref-link{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;color:var(--wt);text-decoration:none;transition:.12s}
  .ref-link:hover{background:var(--wt-bg)}
  td.scope-cell{white-space:normal;min-width:120px}

  /* ---------- Modal ---------- */

  .btn-danger{background:var(--brand);color:#fff}

  .rep-rows{display:flex;flex-direction:column;gap:8px}
  .rep-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--line-2);padding:8px;border-radius:9px}
  .rep-f{padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12.5px}
  .rep-txt{flex:1 1 160px;min-width:120px}
  .rep-sel{flex:1 1 220px;min-width:150px}
  .rep-date{flex:0 0 130px;width:130px}
  .rep-datewrap{position:relative;flex:0 0 130px;width:130px}
  .rep-datewrap .rep-date-show{padding:8px 26px 8px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12.5px;line-height:1.3;white-space:nowrap;overflow:hidden}
  .rep-datewrap .rep-date-show.ph{color:var(--faint)}
  .rep-datewrap .rep-ic{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  .rep-datewrap.dis .rep-date-show{background:#f1f2f4;color:var(--faint)}
  .rep-datewrap.dis .rep-ic{opacity:.4}
  .rep-datewrap .date-over2{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
  .rep-datewrap.dis .date-over2{pointer-events:none}
  .rep-f:disabled{background:#f1f2f4;color:var(--faint)}
  .rep-non{display:flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap;color:var(--ink-2)}
  .rep-non input{width:15px;height:15px;accent-color:var(--brand);margin:0}
  .rep-del{width:30px;height:30px;border:none;background:transparent;color:var(--faint);cursor:pointer;border-radius:7px;font-size:14px;margin-left:auto}
  .rep-handle{cursor:grab;color:var(--faint);font-size:16px;line-height:1;padding:0 4px;align-self:center;user-select:none;flex:none}
  .rep-handle:hover{color:var(--muted)}
  .rep-handle:active{cursor:grabbing}
  .rep-row.dragging{opacity:.4;outline:1px dashed var(--wt)}
  .pl-grip{cursor:grab;color:var(--muted);font-size:14px;margin-right:5px;user-select:none;display:inline-block;line-height:1}
  .pl-grip:active{cursor:grabbing}
  .pl tr[data-sec]:hover .pl-grip{color:var(--ink)}
  .pl tr.dragging{opacity:.45;background:var(--wt-bg,#eef4ff)}
  .rep-del:hover{background:#fde8ec;color:var(--brand)}
  .rep-add{margin-top:9px;background:var(--wt-bg);color:var(--wt);border:1px dashed var(--wt);padding:8px 13px;border-radius:8px;font-weight:600;font-size:12.5px;cursor:pointer}
  .rep-add:hover{filter:brightness(.97)}
  .photo-field{display:flex;align-items:center;gap:16px}
  .photo-prev{width:96px;height:120px;border:1px solid var(--line);border-radius:9px;background:var(--line-2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
  .photo-prev img{width:100%;height:100%;object-fit:cover}
  .photo-prev span{font-size:11px;color:var(--faint)}
  .photo-ctrl{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .photo-input{font-size:12px}
  .photo-prev.sig{width:200px;height:70px}
  .grp-label{font-size:12px;font-weight:700;color:var(--brand-ink);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
  .dash-filter:focus{outline:none;border-color:var(--wt);box-shadow:0 0 0 3px var(--wt-bg)}
  .grid2 .full{grid-column:1/-1}
  .checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
  .chk{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer}
  .ms{position:relative}
  .ms-control{width:100%;display:flex;align-items:center;gap:8px;min-height:42px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;text-align:left;transition:border .15s,box-shadow .15s}
  .ms-control:hover{border-color:var(--faint)}
  .ms.open .ms-control{border-color:var(--wt);box-shadow:0 0 0 3px var(--wt-bg)}
  .ms-chips{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
  .ms-ph{color:var(--faint);font-size:13px}
  .ms-chip{display:inline-flex;align-items:center;max-width:100%;background:var(--wt-bg);color:var(--wt);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600}

  .ms-panel{margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 22px rgba(20,24,31,.12);padding:5px;max-height:250px;overflow-y:auto}

  .ms-opt input{width:16px;height:16px;accent-color:var(--brand);flex:none;margin:0}
  .chk input{width:15px;height:15px;accent-color:var(--brand)}

  /* ---------- Toast ---------- */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.3);opacity:0;transition:.25s;z-index:100;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--brand-ink)}

  .loader{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  .loader.dark{border-color:rgba(0,0,0,.15);border-top-color:var(--ink)}
  @keyframes spin{to{transform:rotate(360deg)}}
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);z-index:200}

  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:12px 16px}
  .legend span{display:inline-flex;align-items:center;gap:6px}

  @media(max-width:860px){
    #app{grid-template-columns:1fr}
    #app.side-collapsed{grid-template-columns:1fr}
    #app.side-collapsed .side{transform:translateX(-100%);width:236px;border-right-color:var(--line)}
    .side-collapse,.side-expand,#app.side-collapsed .side-expand{display:none}
    .side{position:fixed;left:0;top:0;bottom:0;width:236px;transform:translateX(-100%);transition:.25s;z-index:40;box-shadow:0 0 40px rgba(0,0,0,.4)}
    .side.open{transform:none}
    .topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
    .topbar .menu-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center}
    .topbar .ttl{font-weight:700;font-family:'Space Grotesk'}
    .content{padding:18px 16px 60px}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}
    .grid2{grid-template-columns:1fr}
    .table-wrap{max-height:calc(100vh - 160px)}
  }
  .pl-wrap{overflow:auto;max-height:calc(100vh - 240px);border:1px solid var(--line-2);border-radius:12px;background:#fff}
  .pl{border-collapse:collapse;width:100%;min-width:1048px;font-size:12px;table-layout:fixed}
  .pl th,.pl td{border:1px solid var(--line-2);padding:6px 8px;vertical-align:top;overflow-wrap:anywhere}
  .pl thead th{background:#eef1f5;font-weight:600;text-align:center;font-size:11px;white-space:nowrap;position:sticky;top:0;z-index:5}
  .pl td.c{text-align:center}
  .pl th.mo,.pl td.mo{width:36px;text-align:center;padding:4px 2px}
  .pl tr.sec td{background:#eef1f5;font-weight:700;font-size:12px;color:var(--ink)}
  .pl .scope{width:300px;max-width:300px;white-space:normal;overflow-wrap:anywhere}
  .pl .pd{color:var(--muted);font-size:11px;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
  .pl .pd-link{color:var(--brand);font-size:11px;white-space:nowrap;text-decoration:none;margin-left:6px}
  .pl td.mo.click{cursor:pointer}
  .pl td.mo.click:hover{background:#eef4ff}
  .pl .mk{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;font-weight:700;font-size:12px}
  .pl .mk.plan{background:#e7efff;color:#1a56db}
  .pl .mk.done{background:#e6f4ea;color:#137333}
  .pl .stat{background:none;border:none;cursor:pointer;padding:0}
  .pl-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  .pl-year{display:flex;align-items:center;gap:10px}
  .pl-arrow{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
  .pl-arrow:hover{background:#f0f4ff;border-color:var(--brand)}
  .pl-yr{font-size:20px;font-weight:700;min-width:64px;text-align:center}
  .pl-mode{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .pl-mbtn{border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
  .pl-mbtn.act{background:var(--brand);color:#fff;border-color:var(--brand)}
  .pl th.mo.today,.pl td.mo.today{border-left:2px solid #e11d48;background:rgba(225,29,72,.05)}
  .pl thead th.mo.today{background:#f7dde4}
  .pl th.mo.today{position:relative}
  .pl .tdot{width:7px;height:7px;border-radius:50%;background:#e11d48;margin:3px auto 0}
  /* NCR Monitoring */
  tr.rowlink{cursor:pointer}
  tr.rowlink:hover td{background:var(--wt-bg,#eef4ff)}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .info-cell{display:block;padding:10px 20px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
  .info-cell:nth-child(2n){border-right:none}
  .info-k{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;line-height:1.4;margin-bottom:3px}
  .info-v{font-size:13.5px;color:var(--ink);line-height:1.45;word-break:break-word}

    .info-grid{grid-template-columns:1fr}
    .info-cell{border-right:none}
  }
  .rpt-banner{background:#eef4ff;border:1px solid #cdddff;color:#1e3a6e;border-radius:10px;padding:9px 13px;font-size:12.5px;margin-bottom:14px}

  .mod-clock{color:var(--faint);cursor:help}
  .mod-clock:hover{color:var(--brand)}
  .chkbox{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;padding:8px 0}
  .chkbox input{width:17px;height:17px;cursor:pointer}
  .info-v{white-space:pre-line}
  .ncr-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--brand);background:#fff4f4;border:1px solid #f3c9c9;border-radius:999px;padding:2px 9px;cursor:pointer;white-space:nowrap;line-height:1.5}
  .ncr-chip:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  .link-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#fff4f4;border:1px solid #f3c9c9;border-radius:12px;padding:12px 16px;margin-bottom:12px;font-size:13px;color:#7a1f2b}
  .lnk-cb{width:18px;height:18px;cursor:pointer}
  .pl tr[data-row]:hover .lnk-cb{outline:2px solid var(--brand);outline-offset:1px}
  @keyframes rowflash{0%,100%{background:transparent}20%,60%{background:#fff2cc}}

  .cmap-wrap{border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}

  .cmap-mk.pulse{z-index:4;animation:mkpulse .7s ease-in-out infinite}
  @keyframes mkpulse{0%,100%{transform:translate(-50%,-100%) scale(1)}50%{transform:translate(-50%,-100%) scale(1.5)}}
  .cmap-zoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px;z-index:4}

  .cmap-zoom button:hover{border-color:var(--brand);color:var(--brand)}

  .cmap-x{position:absolute;top:6px;right:8px;border:none;background:none;font-size:18px;line-height:1;cursor:pointer;color:var(--muted)}

  .cmap-tip{position:absolute;background:#111;color:#fff;font-size:11.5px;padding:3px 8px;border-radius:6px;pointer-events:none;white-space:nowrap;z-index:5}

</head>

<!-- ===== LOGIN ===== -->
<div id="login" class="hide">

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

// Standard due dates by Level, counted from Audit Report issue date.
//  CAP phase (Immediate + Root Cause + CAP, submitted together) and Implementation of CAP:
//  L1: 7 / 7 · L2: 30 / 60 · L3: 90 / 90 (L3 has no Immediate requirement)
function computeFindingDues(level,reportISO,preAssessment){
  if(!reportISO)return{capDue:"",icapDue:""};
  if(preAssessment)return{capDue:addDays(reportISO,30),icapDue:""}; // Pre Assessment: Immediate within 30 days only
  if(level==="Level 1")return{capDue:addDays(reportISO,7),icapDue:addDays(reportISO,7)};
  if(level==="Level 2")return{capDue:addDays(reportISO,30),icapDue:addDays(reportISO,60)};
  return{capDue:addDays(reportISO,30),icapDue:addDays(reportISO,90)}; // Level 3: Root Cause & CAP +30, Implementation +90 (no Immediate)
}
function icapEffectiveDue(f){return f.icapExt2||f.icapExt1||f.icapDue||null;}
function findingDue(f){ // current outstanding deadline: CAP phase until CAP accepted, then Implementation (latest extension wins)
  if(f.status==="Closed")return{iso:null,phase:"Closed"};
  if(!f.capAccepted)return{iso:f.capDue||null,phase:"CAP"};
  return{iso:icapEffectiveDue(f),phase:"ICAP"};
}
function ncrStats(r){
  const fs=ncrFindings(r),open=fs.filter(f=>f.status!=="Closed");
  let minCap=null,minIcap=null,overdue=0;
  open.forEach(f=>{
    if(!f.capAccepted&&f.capDue){if(!minCap||f.capDue<minCap)minCap=f.capDue;}
    const eff=icapEffectiveDue(f);if(eff){if(!minIcap||eff<minIcap)minIcap=eff;}
    const d=findingDue(f);if(d.iso){const st=dateStatus(d.iso);if(st.days!=null&&st.days<0)overdue++;}
  });
  const rep=fs.filter(f=>f.repetitive==="Yes").length;
  return{total:fs.length,remain:open.length,minCap,minIcap,overdue,rep};
}
// Implement Status is auto: Closed only when ALL findings closed (and at least one exists). Closed Date = latest finding closed date.
function ncrDerivedStatus(r){
  if(r.status==="Cancel")return{status:"Cancel",closedDate:r.closedDate||null};
  const fs=ncrFindings(r);
  if(fs.length){
    if(fs.every(f=>f.status==="Closed")){
      const dates=fs.map(f=>f.closedDate).filter(Boolean).sort();
      return{status:"Closed",closedDate:dates.length?dates[dates.length-1]:todayStr()};
    }
    return{status:"Open",closedDate:null};
  }
  // no findings entered
  if(r.nilFinding)return{status:"Closed",closedDate:r.reportDate||r.closedDate||todayStr()};
  return{status:r.status==="Closed"?"Closed":"Open",closedDate:r.status==="Closed"?(r.closedDate||null):null};
}

const MON3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(iso){if(!iso)return"—";const d=new Date(iso+"T00:00:00");if(isNaN(d))return esc(iso);
  return String(d.getDate()).padStart(2,"0")+" "+MON3[d.getMonth()]+" "+String(d.getFullYear()).slice(2);}
function localISO(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function todayStr(){return localISO(new Date());}
function todayISO(){const d=new Date();d.setHours(0,0,0,0);return d;}
function dateStatus(iso){
  if(!iso)return{level:"none",days:null};
  const d=new Date(iso+"T00:00:00");if(isNaN(d))return{level:"none",days:null};
  const days=Math.round((d-todayISO())/864e5);
  let level="ok";
  if(days<0)level="overdue";else if(days<=30)level="critical";else if(days<=60)level="warning";
  return{level,days};
}
const ST_LABEL={overdue:"Overdue",critical:"Due ≤30d",warning:"Due ≤60d",ok:"OK",none:"No date"};
function durText(days){
  const ad=Math.abs(days),m=Math.floor(ad/30),d=ad%30,parts=[];
  if(m>0)parts.push(m+"m");
  if(d>0||m===0)parts.push(d+"d");
  return parts.join(" ");
}
function statusPill(iso){
  const s=dateStatus(iso);
  let txt;
  if(s.level==="none")txt="—";
  else if(s.level==="overdue")txt=durText(s.days)+" overdue";
  else txt=durText(s.days)+" left";
  return`<span class="pill st-${s.level}"><span class="swatch"></span>${txt}</span>`;
}
// most-urgent date for a person (AMEL vs CRS)
function personDue(row){
  const a=dateStatus(row.amelExp),c=dateStatus(row.crsValidUntil);
  const cand=[a,c].filter(x=>x.days!=null);
  if(!cand.length)return null;
  cand.sort((x,y)=>x.days-y.days);
  return cand[0];
}
// all monitored expiry/due dates for a record (a collection can have several)
function monitorDates(coll,row){
  if(coll==="suppliers")return[{iso:row.expiryDate,label:"Expiry"}];
  if(coll==="contractors")return[{iso:row.caatCertValidation,label:"CAAT cert"},{iso:row.nextMonitor,label:"Next audit"}];
  if(coll==="authorizedPersons")return[{iso:row.amelExp,label:"AMEL exp"},{iso:row.crsValidUntil,label:"CRS valid"}];
  if(coll==="qaPersonnel"){
    const items=qaCourses(row).filter(c=>!c.noNext&&c.nextDue).map(c=>({iso:c.nextDue,label:c.course}));
    if(row.auditorValidationNextDue)items.push({iso:row.auditorValidationNextDue,label:"Auditor validation"});
    return items;
  }
  const f=SCHEMA[coll].monitor;return f?[{iso:row[f],label:SCHEMA[coll].monitorLabel||"Due"}]:[];
}
function rowMonitorStatus(coll,row){
  const ds=monitorDates(coll,row).map(m=>dateStatus(m.iso)).filter(s=>s.days!=null);
  if(!ds.length)return"none";
  ds.sort((a,b)=>a.days-b.days);
  return ds[0].level;
}
// flat list of every monitored date across all monitored collections
function monitorItems(){

    if(!m.iso)continue;const s=dateStatus(m.iso);

   5) DATA LOAD
   ============================================================ */
async function loadAll(){
  for(const c of Object.keys(SCHEMA)){
    try{
      const snap=await getDocs(collection(db,c));
      DATA[c]=snap.docs.map(d=>({_id:d.id,...d.data()}));
    }catch(e){DATA[c]=[];console.warn("load",c,e);}
    if(c==="qaPersonnel")migrateQA(DATA[c]);
    if(c==="authorizedPersons")DATA[c].forEach(r=>{if(!Array.isArray(r.customers)){const a=[];if(r.custVJC)a.push("VJC");if(r.custVNA)a.push("VNA");r.customers=a;}});
    if(SCHEMA[c]&&SCHEMA[c].planner)DATA[c].forEach(r=>{if(!r.rev)r.rev="00";if(!Array.isArray(r.doneMonths))r.doneMonths=[];});
    if(c==="picPersonnel")DATA[c].forEach(r=>{
      if(typeof r.authLimitation==="string"){const s=r.authLimitation;
        if(/and/i.test(s)||(/A320/i.test(s)&&/737/i.test(s)))r.authLimitation=["PIC Transit Check - A320 Family","PIC Transit Check - B 737-8"];
        else if(/737/i.test(s))r.authLimitation=["PIC Transit Check - B 737-8"];
        else if(/A320/i.test(s))r.authLimitation=["PIC Transit Check - A320 Family"];
        else r.authLimitation=s?[s]:[];
      }else if(!Array.isArray(r.authLimitation))r.authLimitation=[];
    });
    SORT[c]={...SCHEMA[c].sort};FILTER[c]={};SEARCH[c]="";
  }
}
function migrateQA(list){
  const cf=SCHEMA.qaPersonnel.fields.find(f=>f.k==="courses")||{};
  const cc=(cf.cols||[]).find(c=>c.k==="course")||{};
  const names=cc.opts||[];
  const isD=v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v);
  (list||[]).forEach(r=>{
    if(!Array.isArray(r.courses)){const cs=[];names.forEach((nm,i)=>{const last=r["c"+i+"_last"],next=r["c"+i+"_next"];
      if(isD(last))cs.push({course:nm,lastDone:last,nextDue:isD(next)?next:null,noNext:!isD(next)});});r.courses=cs;}
    if(typeof r.auditScope==="string")r.auditScope=r.auditScope.split(/[,/]/).map(s=>s.trim()).filter(x=>x&&x!=="-");
  });
}
async function reload(c){
  const snap=await getDocs(collection(db,c));
  DATA[c]=snap.docs.map(d=>({_id:d.id,...d.data()}));
  if(c==="qaPersonnel")migrateQA(DATA[c]);
}

function buildNav(){

  const collLink=(c,extra="")=>{if(!canView(c))return"";const cnt=(DATA[c]||[]).length;return`<a href="#${c}" data-go="${c}" class="${extra}">${ic(SCHEMA[c].icon)}${SCHEMA[c].label}<span class="badge">${cnt}</span></a>`;};
  const grp=(id,open,icon,title,toggle,children)=>{if(!children)return"";return`<button type="button" class="nav-parent ${open?"open":""}" data-toggle="${toggle}">${ic(icon)}${title}<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button><div class="nav-sub ${open?"":"collapsed"}" id="${id}">${children}</div>`;};
  let h=`<a href="#dashboard" data-go="dashboard">${ic("dashboard")}Dashboard <span class="badge alert ${attentionCount()?"":"hide"}">${attentionCount()}</span></a>`;
  h+=`<div class="nav-group">Records</div>`;
  const extGroup=grp("navSubExternal",EXTERNAL_OPEN,"ext","External Provider","external",collLink("suppliers","sub")+collLink("contractors","sub"));
  const authGroup=grp("navSubAuthPers",AUTHPERS_OPEN,"id","Authorized Personnel","authpers",collLink("qaPersonnel","sub")+collLink("authorizedPersons","sub")+collLink("picPersonnel","sub"));
  const planGroup=grp("navSubPlan",PLAN_OPEN,"cal","Compliance Monitoring","plangrp",collLink("auditPlan","sub")+collLink("ncrMonitoring","sub"));

  }
  nav.innerHTML=h;
  nav.querySelectorAll("a[data-go]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();go(a.dataset.go);}));
  const wire=(sel,sub,setter)=>{const t=nav.querySelector(sel);if(t)t.addEventListener("click",()=>{const open=setter();nav.querySelector(sub).classList.toggle("collapsed",!open);t.classList.toggle("open",open);});};
  wire('[data-toggle="external"]',"#navSubExternal",()=>EXTERNAL_OPEN=!EXTERNAL_OPEN);

function setActive(){
  const nav=$("#nav");
  nav.querySelectorAll("a").forEach(a=>a.classList.toggle("active",a.dataset.go===CURRENT));
  const openGroup=(sub,tog)=>{nav.querySelector(sub)?.classList.remove("collapsed");nav.querySelector(tog)?.classList.add("open");};
  if(CURRENT==="suppliers"||CURRENT==="contractors"){EXTERNAL_OPEN=true;openGroup("#navSubExternal",'[data-toggle="external"]');}
  if(CURRENT==="qaPersonnel"||CURRENT==="authorizedPersons"||CURRENT==="picPersonnel"){AUTHPERS_OPEN=true;openGroup("#navSubAuthPers",'[data-toggle="authpers"]');}
  if(CURRENT==="auditPlan"||CURRENT==="ncrMonitoring"){PLAN_OPEN=true;openGroup("#navSubPlan",'[data-toggle="plangrp"]');}
}
function go(v){
  if(v!=="dashboard"&&v!=="users"&&v!=="import"&&SCHEMA[v]&&!canView(v))v="dashboard";
  if((v==="users"||v==="import")&&!IS_ADMIN)v="dashboard";
  CURRENT=v;NCR_DETAIL=null;MOC_DETAIL=null;MOC_SELMODE=false;MOC_SEL=new Set();SELMODE=false;SEL=new Set();if(v!=="auditPlan")NCR_LINK_MODE=null;setActive();closeSide();window.scrollTo(0,0);
  if(v==="dashboard")renderDashboard();
  else if(v==="moc")renderMoc();
  else if(v==="users")renderUsers();
  else if(v==="import")renderImport();
  else renderCollection(v);
}
function gotoPlanRow(planId){
  const p=(DATA.auditPlan||[]).find(x=>x._id===planId);
  NCR_DETAIL=null;NCR_LINK_MODE=null;CURRENT="auditPlan";
  if(p){PLAN_COLL="auditPlan";if(p.year!=null)PLAN_YEAR=String(p.year);if(p.rev!=null)PLAN_REV=String(p.rev);}
  setActive();closeSide();
  renderCollection("auditPlan");
  setTimeout(()=>{
    const host=$("#tableHost"),tr=host&&host.querySelector(`tr[data-row="${planId}"]`);

    else window.scrollTo(0,0);
  },120);
}

function renderDashboard(){
  const allItems=monitorItems();
  let items=allItems.slice();
  if(DASH_TYPE)items=items.filter(i=>i.c===DASH_TYPE);
  if(DASH_YEAR)items=items.filter(i=>i.iso&&String(i.iso).slice(0,4)===DASH_YEAR);
  const buckets={overdue:[],critical:[],warning:[],ok:[]};
  for(const it of items)if(buckets[it.level])buckets[it.level].push(it);
  const BUCKET_LABEL={overdue:"Overdue",critical:"Action ≤30 days",warning:"Prepare ≤60 days",ok:"On track"};
  const tiles=[
    {b:"overdue",k:"Overdue",v:buckets.overdue.length,bar:"ov",dot:"ov",meta:"เลยกำหนดแล้ว"},
    {b:"critical",k:"Action ≤30 days",v:buckets.critical.length,bar:"cr",dot:"cr",meta:"ต้องดำเนินการด่วน"},
    {b:"warning",k:"Prepare ≤60 days",v:buckets.warning.length,bar:"wa",dot:"wa",meta:"เตรียมการ"},
    {b:"ok",k:"On track",v:buckets.ok.length,bar:"ok",dot:"ok",meta:"ปกติ"}
  ];
  const attention=DASH_BUCKET
    ? buckets[DASH_BUCKET].slice().sort((a,b)=>(a.days==null?1e9:a.days)-(b.days==null?1e9:b.days))
    : DASH_YEAR
      ? items.filter(i=>i.days!=null).sort((a,b)=>a.days-b.days)
      : [...buckets.overdue,...buckets.critical,...buckets.warning].sort((a,b)=>a.days-b.days);
  const DASH_ORDER=["companyCerts","aircraft","qaPersonnel","authorizedPersons","suppliers","contractors"];
  const typeOpts=DASH_ORDER.filter(c=>MONITORED.includes(c)).map(c=>`<option value="${c}" ${DASH_TYPE===c?"selected":""}>${esc(SCHEMA[c].label)}</option>`).join("");
  const years=[...new Set(allItems.filter(i=>i.iso).map(i=>String(i.iso).slice(0,4)))].sort();
  const yearOpts=years.map(y=>`<option value="${y}" ${DASH_YEAR===y?"selected":""}>${y}</option>`).join("");
  const panelTitle=DASH_BUCKET?`รายการ: ${BUCKET_LABEL[DASH_BUCKET]}`:(DASH_YEAR?`หมดอายุ / ครบกำหนดในปี ${esc(DASH_YEAR)}`:"Attention needed");
  const attnHint=DASH_BUCKET
    ?`${attention.length} รายการในกลุ่ม “${BUCKET_LABEL[DASH_BUCKET]}” · คลิกการ์ดซ้ำเพื่อล้างตัวกรอง`
    :(DASH_YEAR?`${attention.length} รายการที่จะหมดอายุ/ครบกำหนดในปี ${esc(DASH_YEAR)}`:`${attention.length} รายการที่ต้องดูแล (เรียงตามความเร่งด่วน) · คลิกการ์ดด้านบนเพื่อดูเฉพาะกลุ่ม`);
  const v=$("#view");
  v.innerHTML=`
    <div class="page-head">
      <div><h1>Dashboard</h1><div class="sub">ภาพรวมการติดตามวันหมดอายุ / วันครบกำหนด · ${esc(fmtDate(todayStr()))}</div></div>
      <div class="page-actions">
        <button class="btn btn-ghost" style="width:auto" id="dashPdfBtn">Export PDF</button>
        <button class="btn btn-ghost" style="width:auto" id="dashXlsxBtn">Export CSV</button>
        <select id="dashYearFilter" class="dash-filter"><option value="">Year: ทั้งหมด</option>${yearOpts}</select>
        <select id="dashTypeFilter" class="dash-filter"><option value="">Type: ทั้งหมด</option>${typeOpts}</select>
      </div>
    </div>
    <div class="tiles">${tiles.map(t=>`
      <div class="tile clickable ${DASH_BUCKET===t.b?"active":""}" data-bucket="${t.b}" title="คลิกเพื่อดูรายการกลุ่มนี้"><div class="bar bar-${t.bar}"></div>
        <div class="k"><span class="swatch dot-${t.dot}"></span>${t.k}</div>
        <div class="v">${t.v}</div><div class="meta">${t.meta}</div><span class="chev">${DASH_BUCKET===t.b?"▲ ซ่อน":"▼ ดู"}</span></div>`).join("")}
    </div>
    <div class="panel">
      <div class="panel-head"><h2>${panelTitle}</h2><span class="hint">${attnHint}</span></div>
      ${attention.length?`<div class="table-wrap" style="border:none;box-shadow:none;border-radius:0">
        <table><thead><tr>
          <th class="nosort">Type</th><th class="nosort">Record</th><th class="nosort">What</th><th class="nosort">Due</th><th class="nosort">Status</th><th class="nosort"></th>

          <span><span class="swatch dot-wa"></span>≤60 days</span>

        </div>`

    </div>`;
  v.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>{const c=b.dataset.jump,id=b.dataset.id;go(c);setTimeout(()=>openEdit(c,(DATA[c]||[]).find(r=>r._id===id)),60);}));
  v.querySelectorAll("[data-bucket]").forEach(t=>t.addEventListener("click",()=>{
    DASH_BUCKET=DASH_BUCKET===t.dataset.bucket?"":t.dataset.bucket;renderDashboard();
    document.querySelector(".panel")?.scrollIntoView({behavior:"smooth",block:"nearest"});
  }));
  $("#dashTypeFilter")?.addEventListener("change",e=>{DASH_TYPE=e.target.value;renderDashboard();});
  $("#dashYearFilter")?.addEventListener("change",e=>{DASH_YEAR=e.target.value;renderDashboard();});
  $("#dashPdfBtn")?.addEventListener("click",exportDashboardPDF);
  $("#dashXlsxBtn")?.addEventListener("click",exportDashboardCSV);

function renderCollection(c){
  const IS_ADMIN=canEdit(c);
  const sc=SCHEMA[c];const v=$("#view");
  const filterHtml=(sc.filters||[]).map(f=>{
    let vals;
    if(f.yearFilter){const set=new Set();(DATA[c]||[]).forEach(r=>monitorDates(c,r).forEach(d=>{if(d.iso)set.add(String(d.iso).slice(0,4));}));vals=[...set].filter(Boolean).sort();}
    else if(f.opts)vals=f.opts;
    else if(f.multi){const set=new Set();(DATA[c]||[]).forEach(r=>arrField(r,f.key).forEach(x=>set.add(x)));vals=[...set].sort();}
    else vals=[...new Set((DATA[c]||[]).map(r=>r[f.key]).filter(x=>x!=null&&x!==""))].sort();
    const lbl=v=>f.key==="scopeClasses"?("Class "+v):v;
    return`<select data-filter="${f.key}"><option value="">${f.label}: ทั้งหมด</option>${vals.map(val=>`<option value="${esc(val)}" ${FILTER[c][f.key]===String(val)?"selected":""}>${esc(lbl(val))}</option>`).join("")}</select>`;
  }).join("");
  const statusFilter=sc.monitor?`<select data-statusfilter><option value="">Expiry: ทั้งหมด</option>${["overdue","critical","warning","ok"].map(l=>`<option value="${l}" ${FILTER[c]._status===l?"selected":""}>${ST_LABEL[l]}</option>`).join("")}</select>`:"";
  v.innerHTML=`
    <div class="page-head">
      <div><h1>${sc.label}</h1><div class="sub">${esc(sc.thai)}</div></div>
      <div class="page-actions">
        <button class="btn btn-ghost" style="width:auto" id="exportBtn">Export PDF</button>
        <button class="btn btn-ghost" style="width:auto" id="exportXlsxBtn">Export CSV</button>
        ${IS_ADMIN&&!SCHEMA[c].planner?(SELMODE
          ?`<span class="bulk-bar"><span id="bulkCount"></span><button class="btn btn-ghost btn-sm" id="bulkClear">ยกเลิก</button><button class="btn btn-danger btn-sm" id="bulkDel">ลบที่เลือก</button></span><button class="btn btn-primary" style="width:auto" id="addBtn">+ เพิ่มรายการ</button>`
          :`<button class="btn btn-ghost" style="width:auto" id="selToggle">เลือกหลายรายการ</button><button class="btn btn-primary" style="width:auto" id="addBtn">+ เพิ่มรายการ</button>`):""}
      </div>
    </div>
    <div class="toolbar">
      <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input type="search" placeholder="ค้นหาทุกช่อง…" id="searchInp" value="${esc(SEARCH[c]||"")}"></div>
      ${filterHtml}
      <div class="spacer"></div>
      <span class="count-chip" id="countChip"></span>
    </div>
    ${c==="contractors"?`<div class="cmap-wrap"><div class="cmap-head"><span>แผนที่ตำแหน่ง MNT Contractors</span><span class="cmap-hint" id="cmapHint"></span></div><div id="contractorMap"></div></div>`:""}
    <div id="tableHost"></div>`;
  $("#exportBtn").addEventListener("click",()=>c==="picPersonnel"?openPicExport():c==="authorizedPersons"?openMntExport():c==="suppliers"?openSupplierExport():c==="contractors"?openContractorExport():c==="auditPlan"?openAuditExport("auditPlan"):exportPDF(c));
  $("#exportXlsxBtn").addEventListener("click",()=>exportCSV(c));
  if(IS_ADMIN){$("#addBtn")?.addEventListener("click",()=>openEdit(c,null));
    $("#selToggle")?.addEventListener("click",()=>{SELMODE=true;SEL=new Set();renderCollection(c);});
    $("#bulkClear")?.addEventListener("click",()=>{SELMODE=false;SEL.clear();renderCollection(c);});
    $("#bulkDel")?.addEventListener("click",async()=>{
      if(!SEL.size){toast("ยังไม่ได้เลือกรายการ",true);return;}
      if(!confirm(`ลบ ${SEL.size} รายการที่เลือก? การลบไม่สามารถกู้คืนได้`))return;
      const ids=[...SEL],btn=$("#bulkDel");btn.disabled=true;btn.innerHTML='<span class="loader"></span> กำลังลบ';
      try{
        for(let i=0;i<ids.length;i+=400){const batch=writeBatch(db);ids.slice(i,i+400).forEach(id=>batch.delete(doc(db,c,id)));await batch.commit();}
        SEL.clear();SELMODE=false;await reload(c);buildNav();renderCollection(c);toast(`ลบ ${ids.length} รายการแล้ว`);
      }catch(e){btn.disabled=false;btn.textContent="ลบที่เลือก";toast("ลบไม่สำเร็จ: "+(e.code||e.message),true);}
    });
  }
  $("#searchInp").addEventListener("input",e=>{SEARCH[c]=e.target.value;drawTable(c);});
  v.querySelectorAll("[data-filter]").forEach(s=>s.addEventListener("change",e=>{FILTER[c][e.target.dataset.filter]=e.target.value;drawTable(c);}));
  const sf=v.querySelector("[data-statusfilter]");if(sf)sf.addEventListener("change",e=>{FILTER[c]._status=e.target.value;drawTable(c);});
  drawTable(c);
  if(c==="contractors")initContractorMap();

function anchorXY(lat,lng,cc){const base=CMAP_CENTROID[cc],ref=CMAP_CC_LATLNG[cc];
  if(base&&ref)return[base[0]+(lng-ref[1])*CMAP_SX, base[1]+(lat-ref[0])*CMAP_SY];
  return base||null;}
function contractorMapXY(r){
  // 1) geocoded coordinates from Address (พิมพ์ที่อยู่ → หาพิกัดให้ตอนบันทึก)
  const gla=Number(r.geoLat),glo=Number(r.geoLng);
  if(Number.isFinite(gla)&&Number.isFinite(glo)&&r.geoCC&&CMAP_CENTROID[r.geoCC])return anchorXY(gla,glo,r.geoCC);
  // 2) fallback: read Address / legacy Location text
  const txt=String(r.address||r.country||"").toLowerCase().replace(/\./g,"").replace(/\s+/g," ");
  if(!txt)return null;
  // city gazetteer on any comma segment
  for(const seg of txt.split(",").map(s=>s.trim())){if(CMAP_CITY[seg]){const c=CMAP_CITY[seg];return anchorXY(c[0],c[1],c[2]);}}
  // country name appearing in the text (min length 4 to avoid false hits)
  let code=null;
  for(const k in CMAP_NAME2CODE){if(k.length>=4&&txt.includes(k)){code=CMAP_NAME2CODE[k];break;}}
  if(code&&CMAP_CENTROID[code])return CMAP_CENTROID[code];
  return null;
}
async function geocodeLocation(addr){
  const tryQ=async s=>{
    try{const u="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&q="+encodeURIComponent(s);
      const res=await fetch(u,{headers:{"Accept":"application/json"}});if(!res.ok)return null;
      const j=await res.json();if(!j||!j.length)return null;const it=j[0];
      const cc=(it.address&&it.address.country_code||"").toLowerCase();
      const lat=parseFloat(it.lat),lng=parseFloat(it.lon);
      if(!Number.isFinite(lat)||!Number.isFinite(lng)||!CMAP_CENTROID[cc])return null;
      return{lat,lng,cc};}catch(_){return null;}
  };
  const parts=String(addr).split(",").map(s=>s.trim()).filter(Boolean);
  // candidates: full, then progressively drop leading segments (keep the country tail)
  const cands=[addr];
  if(parts.length>=3)cands.push(parts.slice(-3).join(", "));
  if(parts.length>=2)cands.push(parts.slice(-2).join(", "));
  if(parts.length>=1)cands.push(parts.slice(-1).join(", "));
  const tried=new Set();
  for(const q of cands){const qq=q.trim();if(!qq||tried.has(qq))continue;tried.add(qq);
    const g=await tryQ(qq);if(g)return g;}
  return null;
}

function searchBlob(v,acc){
  if(v==null)return;
  if(Array.isArray(v)){v.forEach(x=>searchBlob(x,acc));return;}
  if(typeof v==="object"){Object.values(v).forEach(x=>searchBlob(x,acc));return;}
  const s=String(v);
  if(/^(https?:\/\/|data:|www\.)/i.test(s.trim()))return; // skip URLs/data-uris
  acc.push(s.toLowerCase());
  if(/^\d{4}-\d{2}-\d{2}/.test(s))acc.push(fmtDate(s).toLowerCase());
}

    else{if(ch==='"')q=true;else if(ch===","){row.push(cur);cur="";}else if(ch==="\n"){row.push(cur);rows.push(row);row=[];cur="";}else if(ch==="\r"){}else cur+=ch;}
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}
function parseAnyDate(s){
  s=String(s).trim();if(!s)return"";
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){let[_,a,b,y]=m;if(y.length===2)y="20"+y;return`${y}-${String(b).padStart(2,"0")}-${String(a).padStart(2,"0")}`;}
  const d=new Date(s);if(!isNaN(d))return localISO(d);
  return"";
}
function csvToRecords(c,rows){
  const fields=(SCHEMA[c].fields||[]).filter(f=>f.k&&!["repeat","photo","checks","group"].includes(f.type));
  const norm=s=>String(s).toLowerCase().replace(/\(.*?\)/g," ").replace(/[\s_\-–—/.]+/g," ").trim();
  const header=rows[0].map(h=>String(h).trim());
  const map=header.map(h=>{const hn=norm(h);return fields.find(f=>norm(f.k)===hn||norm(f.l)===hn)||null;});
  const out=[];
  for(let i=1;i<rows.length;i++){const r=rows[i],obj={};
    map.forEach((f,ci)=>{if(!f)return;const raw=(r[ci]==null?"":String(r[ci])).trim();
      if(f.type==="date")obj[f.k]=parseAnyDate(raw);
      else if(f.type==="multiselect")obj[f.k]=raw?raw.split(/[,;|]/).map(x=>x.trim()).filter(Boolean):[];
      else if(f.type==="number")obj[f.k]=raw===""?null:Number(raw);
      else obj[f.k]=raw;
    });
    // year/rev passthrough for auditPlan
    header.forEach((h,ci)=>{const hl=h.toLowerCase();if(hl==="year")obj.year=String(r[ci]||"").trim();if(hl==="rev")obj.rev=String(r[ci]||"").trim();});
    if(Object.values(obj).some(v=>v!=null&&v!==""&&!(Array.isArray(v)&&!v.length)))out.push(obj);
  }
  return out;
}

function wirePlanDrag(host,c){
  const tbody=host.querySelector(".pl tbody");if(!tbody)return;
  let dragEl=null,dragSec=null;
  const sameSec=()=>[...tbody.querySelectorAll("tr[data-sec]")].filter(rw=>rw.dataset.sec===dragSec);
  host.querySelectorAll(".pl-grip").forEach(grip=>{
    const row=grip.closest("tr");
    grip.addEventListener("dragstart",e=>{dragEl=row;dragSec=row.dataset.sec;row.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain","");e.dataTransfer.setDragImage(row,20,12);}catch(_){}});
    grip.addEventListener("dragend",()=>{if(dragEl)dragEl.classList.remove("dragging");persistPlanOrder(c,dragSec);dragEl=null;dragSec=null;});
  });
  tbody.addEventListener("dragover",e=>{
    if(!dragEl)return;e.preventDefault();
    const others=sameSec().filter(rw=>rw!==dragEl);
    const after=others.find(rw=>{const b=rw.getBoundingClientRect();return e.clientY<b.top+b.height/2;});
    if(after){if(after!==dragEl.nextSibling)tbody.insertBefore(dragEl,after);}
    else{const last=others[others.length-1];if(last&&last!==dragEl)last.after(dragEl);}
  });
}
function persistPlanOrder(c,sec){
  const tbody=$(".pl tbody");if(!tbody||sec==null)return;
  const rows=[...tbody.querySelectorAll("tr[data-sec]")].filter(rw=>rw.dataset.sec===sec);
  rows.forEach((rw,i)=>{
    const id=rw.dataset.row,r=(DATA[c]||[]).find(x=>x._id===id),newOrd=i+1;
    if(r&&Number(r.ord)!==newOrd)planSave(c,id,{ord:newOrd});
    const noCell=rw.querySelector(".pl-no");if(noCell)noCell.textContent=i+1;
  });
}
function fmtWhen(ts){if(!ts)return"";const d=new Date(ts);if(isNaN(d))return"";

  const D=String(d.getDate()).padStart(2,"0"),mo=M[d.getMonth()],Y=String(d.getFullYear()).slice(2);
  const hh=String(d.getHours()).padStart(2,"0"),mm=String(d.getMinutes()).padStart(2,"0");
  return `${D} ${mo} ${Y}, ${hh}:${mm}`;}
function whoName(email){if(!email)return"";if(email==="auto")return"ระบบ (auto)";return String(email).split("@")[0];}
function modTitle(r){
  if(!r.updatedBy&&!r.updatedAt&&!r.createdBy)return"ยังไม่มีประวัติการแก้ไข";
  const email=r.updatedBy||r.createdBy||"";
  const when=r.updatedAt||r.createdAt;
  const extra=(email&&email!=="auto")?` (${email})`:"";
  return `แก้ไขล่าสุดโดย ${whoName(email)||"?"}${when?" · "+fmtWhen(when):""}${extra}`;
}
function modClock(r){
  return `<span class="icon-btn mod-clock" title="${esc(modTitle(r))}" tabindex="0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg></span>`;
}
function drawTable(c){
  if(SCHEMA[c].planner){drawPlanner(c);return;}
  const IS_ADMIN=canEdit(c);
  if(c==="ncrMonitoring"&&NCR_DETAIL){renderNcrDetail(NCR_DETAIL);return;}
  const sc=SCHEMA[c],rows=getRows(c),host=$("#tableHost");
  if(!host)return;
  const _prevWrap=host.querySelector(".table-wrap"),_prevTop=_prevWrap?_prevWrap.scrollTop:0,_prevWin=window.scrollY;
  $("#countChip").textContent=`${rows.length} / ${(DATA[c]||[]).length} รายการ`;
  if(!rows.length){host.innerHTML=`<div class="table-wrap"><div class="empty"><div class="big">ไม่พบรายการ</div>${SEARCH[c]||Object.keys(FILTER[c]).some(k=>FILTER[c][k])?"ลองล้างตัวกรองหรือคำค้นหา":(IS_ADMIN?"กด “เพิ่มรายการ” เพื่อสร้างข้อมูลแรก":"ยังไม่มีข้อมูล")}</div></div>`;return;}
  const cols=sc.columns;
  let h=`<div class="table-wrap"><table><thead><tr>`;
  if(IS_ADMIN&&SELMODE)h+=`<th class="nosort chk-col"><input type="checkbox" id="selAll" title="เลือกทั้งหมด"></th>`;
  for(const col of cols){
    const sortable=!col.render||col.statusOf;
    const sorted=SORT[c].key===col.k;
    const filterable=col.k&&col.k!=="_index"&&col.l!=="";
    const active=COLFILTER[c]&&COLFILTER[c][col.k]&&COLFILTER[c][col.k].size;
    h+=`<th class="${sortable?"":"nosort"} ${sorted?"sorted":""}"><span class="th-in">${sortable?`<span class="th-sort" data-sort="${col.k}">${esc(col.l)}<span class="arr">${sorted?(SORT[c].dir>0?"▲":"▼"):"↕"}</span></span>`:`<span>${esc(col.l)}</span>`}${filterable?`<button class="th-funnel ${active?"on":""}" data-colfilter="${col.k}" title="กรองคอลัมน์นี้"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 4h18l-7 9v6l-4 2v-8z"/></svg></button>`:""}</span></th>`;
  }
  if(IS_ADMIN)h+=`<th class="nosort"></th>`;
  h+=`</tr></thead><tbody>`;
  rows.forEach((r,idx)=>{
    h+=sc.detail?`<tr class="rowlink" data-open="${r._id}" data-rowid="${r._id}">`:`<tr data-rowid="${r._id}">`;
    if(IS_ADMIN&&SELMODE)h+=`<td class="chk-col"><input type="checkbox" data-sel="${r._id}" ${SEL.has(r._id)?"checked":""}></td>`;
    for(const col of cols){
      let cell;
      if(col.index)cell=String(idx+1);
      else if(col.statusOf){cell=`<span class="mono">${fmtDate(r[col.statusOf])}</span> ${statusPill(r[col.statusOf])}`;}
      else if(col.render)cell=col.render(r[col.k],r);
      else if(col.date)cell=`<span class="mono">${fmtDate(r[col.k])}</span>`;
      else cell=esc(r[col.k]??"—")||"—";
      h+=`<td class="${col.cls||""}">${cell}</td>`;
    }
    if(IS_ADMIN)h+=`<td><div class="row-actions">${modClock(r)}
      <button class="icon-btn" data-edit="${r._id}" title="แก้ไข"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button>
      <button class="icon-btn del" data-del="${r._id}" title="ลบ"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></button>
    </div></td>`;
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>`;
  host.innerHTML=h;
  const _newWrap=host.querySelector(".table-wrap");if(_newWrap&&_prevTop)_newWrap.scrollTop=_prevTop;
  if(_prevWin)window.scrollTo(0,_prevWin);
  host.querySelectorAll("[data-sort]").forEach(th=>th.addEventListener("click",()=>{
    const k=th.dataset.sort;if(SORT[c].key===k)SORT[c].dir*=-1;else{SORT[c].key=k;SORT[c].dir=1;}drawTable(c);}));
  host.querySelectorAll("[data-colfilter]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();openColFilter(c,b.dataset.colfilter,b);}));
  host.querySelectorAll("[data-opendetail]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();openNcrDetail(b.dataset.opendetail);}));
  if(sc.detail)host.querySelectorAll("tr[data-open]").forEach(tr=>tr.addEventListener("click",e=>{
    if(e.target.closest("button,input,a"))return;openNcrDetail(tr.dataset.open);}));
  if(c==="contractors"){host.querySelectorAll("tr[data-rowid]").forEach(tr=>{
    const mk=()=>document.querySelector(`#contractorMap .cmap-mk[data-id="${tr.dataset.rowid}"]`);
    tr.addEventListener("mouseenter",()=>{const m=mk();if(m){m.classList.add("pulse");m.style.display="";}});
    tr.addEventListener("mouseleave",()=>{const m=mk();if(m)m.classList.remove("pulse");});
  });}
  if(IS_ADMIN){
    host.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>openEdit(c,(DATA[c]||[]).find(r=>r._id===b.dataset.edit))));
    host.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>confirmDelete(c,b.dataset.del)));
    const rowCbs=[...host.querySelectorAll("[data-sel]")],selAll=host.querySelector("#selAll");
    const syncAll=()=>{if(!selAll)return;const vis=rowCbs.length,sel=rowCbs.filter(x=>x.checked).length;selAll.checked=vis>0&&sel===vis;selAll.indeterminate=sel>0&&sel<vis;};
    rowCbs.forEach(cb=>cb.addEventListener("change",()=>{cb.checked?SEL.add(cb.dataset.sel):SEL.delete(cb.dataset.sel);syncAll();updateBulk(c);}));
    if(selAll)selAll.addEventListener("change",()=>{rowCbs.forEach(cb=>{cb.checked=selAll.checked;cb.checked?SEL.add(cb.dataset.sel):SEL.delete(cb.dataset.sel);});updateBulk(c);});
    syncAll();updateBulk(c);
  }
}

function openNcrDetail(id){NCR_DETAIL=id;CURRENT="ncrMonitoring";setActive();closeSide();window.scrollTo(0,0);renderNcrDetail(id);}
function wireDatePickers(ov){
  ov.querySelectorAll(".datewrap").forEach(wrap=>{
    const inp=wrap.querySelector(".date-over"),show=wrap.querySelector(".date-show");
    const refresh=()=>{if(inp.value){show.textContent=fmtDate(inp.value);show.classList.remove("ph");}else{show.textContent="— เลือกวันที่ —";show.classList.add("ph");}};
    inp.addEventListener("change",refresh);inp.addEventListener("input",refresh);
    if(typeof inp.showPicker==="function"){
      const open=()=>{try{inp.showPicker();}catch(_){}};
      inp.addEventListener("click",open);show.addEventListener("click",open);
    }else{inp.style.position="static";inp.style.opacity="1";inp.style.width="100%";inp.style.height="auto";show.style.display="none";}
  });
}
function findingPhaseCell(f,which){
  // which: "cap" | "icap" — due date on line 1, Accepted tag / countdown pill on line 2
  const line2=html=>`<div style="margin-top:4px">${html}</div>`;
  if(which==="cap"){
    if(!f.capDue)return'<span class="tag gray">—</span>';
    const base=`<span class="mono">${fmtDate(f.capDue)}</span>`;
    if(f.capAccepted)return`${base}${line2(`<span class="tag green">Accepted ${fmtDate(f.capAccepted)}</span>`)}`;
    if(f.status==="Closed")return base;
    return`${base}${line2(statusPill(f.capDue))}`;
  }
  const eff=icapEffectiveDue(f);
  if(!eff)return'<span class="tag gray">—</span>';
  const ext=f.icapExt2?"ขยาย 2":f.icapExt1?"ขยาย 1":"";
  const base=`<span class="mono">${fmtDate(eff)}</span>${ext?` <span class="tag amber" style="font-size:11px">${ext}</span>`:""}`;
  if(f.icapAccepted)return`${base}${line2(`<span class="tag green">Accepted ${fmtDate(f.icapAccepted)}</span>`)}`;
  if(f.status==="Closed")return base;
  if(!f.capAccepted)return base; // still in CAP phase — no countdown yet
  return`${base}${line2(statusPill(eff))}`;
}

  document.body.appendChild(ov);MODAL=ov;ov.dataset.noclose="1";
  ov.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal));
  wireDatePickers(ov);

  const getDate=k=>$("#f_"+k,ov)?.value||"";
  // recompute auto due dates when Level changes
  $("#f_level",ov)?.addEventListener("change",e=>{
    if($("#f_preAssessment",ov)?.checked)return;

  });

    ov.querySelectorAll('[data-grpf="icap"]').forEach(el=>el.style.display=pre?"none":"");

    const lvField=ov.querySelector('[data-fk="level"]');if(lvField)lvField.style.display=pre?"none":"";
    if(capGrp)capGrp.firstChild.textContent=pre?"Immediate Action (Pre Assessment)":"Immediate + Root Cause + CAP (ตอบพร้อมกัน)";
    if(pre){const d=computeFindingDues(null,reportISO,true);setDate("capDue",d.capDue);setDate("icapDue","");setDate("icapExt1","");setDate("icapExt2","");}
    else{const d=computeFindingDues($("#f_level",ov)?.value||"Level 2",reportISO,false);setDate("capDue",d.capDue);setDate("icapDue",d.icapDue);}
  };
  $("#f_preAssessment",ov)?.addEventListener("change",e=>applyPre(e.target.checked));
  applyPre(!!f.preAssessment);
  // extension buttons: +30 from previous effective due
  ov.querySelector('[data-ext="1"]')?.addEventListener("click",()=>{
    const base=getDate("icapDue");if(!base){toast("ต้องมี Due (auto) ก่อนจึงจะขยายได้",true);return;}
    setDate("icapExt1",addDays(base,30));toast("ตั้ง Due ขยายครั้งที่ 1 (+30 วัน)");
  });
  ov.querySelector('[data-ext="2"]')?.addEventListener("click",()=>{
    const base=getDate("icapExt1")||getDate("icapDue");
    if(!getDate("icapExt1")){toast("ต้องขยายครั้งที่ 1 ก่อน",true);return;}
    setDate("icapExt2",addDays(base,30));toast("ตั้ง Due ขยายครั้งที่ 2 (+30 วัน)");
  });
  // accepting Implementation auto-closes the finding
  $("#f_icapAccepted",ov)?.addEventListener("change",e=>{
    const st=$("#f_status",ov);if(e.target.value&&st){st.value="Closed";}
  });
  // Pre-Assessment: accepting CAP auto-closes the finding
  $("#f_capAccepted",ov)?.addEventListener("change",e=>{
    if($("#f_preAssessment",ov)?.checked&&e.target.value){const st=$("#f_status",ov);if(st)st.value="Closed";}
  });
  ov.querySelector("[data-save]").addEventListener("click",()=>saveFinding(auditRow,idx,ov));
}
async function saveFinding(auditRow,idx,ov){
  const obj={};
  for(const fd of FINDING_FIELDS){
    if(fd.type==="group")continue;
    if(fd.type==="checkbox"){obj[fd.k]=!!$("#f_"+fd.k,ov)?.checked;continue;}
    let val=$("#f_"+fd.k,ov)?.value;
    if(fd.type==="number")val=val===""?null:Number(val);
    obj[fd.k]=val===""?null:val;
  }
  if(!obj.description){toast("กรุณากรอก: Non-Conformity Description",true);return;}
  if(obj.preAssessment){ // only Immediate within 30 days; no Implementation phase; closes on CAP Accepted
    obj.level=null;obj.icapDue=null;obj.icapExt1=null;obj.icapExt2=null;obj.icapSubmitted=null;obj.icapAccepted=null;
    if(obj.capAccepted){obj.status="Closed";obj.closedDate=obj.capAccepted;}
    else if(obj.status==="Closed"){obj.closedDate=obj.closedDate||todayStr();}
    else{obj.closedDate=null;}
  }else{
    // Implementation accepted ⇒ finding closed; closed date = acceptance date
    if(obj.icapAccepted){obj.status="Closed";obj.closedDate=obj.icapAccepted;}
    else if(obj.status==="Closed"){obj.closedDate=obj.closedDate||todayStr();}
    else{obj.closedDate=null;}
  }
  const findings=[...ncrFindings(auditRow)];
  if(idx==null)findings.push(obj);else findings[idx]=obj;
  const der=ncrDerivedStatus({...auditRow,findings});
  const btn=ov.querySelector("[data-save]");btn.disabled=true;btn.innerHTML='<span class="loader"></span>';
  try{
    await updateDoc(doc(db,"ncrMonitoring",auditRow._id),{findings,nilFinding:false,status:der.status,closedDate:der.closedDate,updatedAt:Date.now(),updatedBy:ME.email});
    await reload("ncrMonitoring");
    await syncPlanFromNcr((DATA.ncrMonitoring||[]).find(n=>n._id===auditRow._id));
    closeModal();buildNav();
    renderNcrDetail(auditRow._id);
    toast(idx==null?"เพิ่ม Finding แล้ว":"บันทึกแล้ว");
  }catch(e){btn.disabled=false;btn.textContent="บันทึก";toast("บันทึกไม่สำเร็จ: "+(e.code||e.message),true);}
}
async function deleteFinding(auditRow,idx){
  const f=ncrFindings(auditRow)[idx];
  if(!confirm(`ลบ Finding CAR #${idx+1} ?\n"${(f&&f.description||"").slice(0,80)}"\nการลบไม่สามารถย้อนกลับได้`))return;
  const findings=ncrFindings(auditRow).filter((_,i)=>i!==idx);
  const der=ncrDerivedStatus({...auditRow,findings});
  try{
    await updateDoc(doc(db,"ncrMonitoring",auditRow._id),{findings,status:der.status,closedDate:der.closedDate,updatedAt:Date.now(),updatedBy:ME.email});
    await reload("ncrMonitoring");buildNav();renderNcrDetail(auditRow._id);toast("ลบ Finding แล้ว");
  }catch(e){toast("ลบไม่สำเร็จ: "+(e.code||e.message),true);}
}

let DRAG_ROW=null;
function repDragAfter(container,y){
  const els=[...container.querySelectorAll(".rep-row:not(.dragging)")];
  let closest={offset:-Infinity,el:null};
  for(const el of els){const box=el.getBoundingClientRect();const off=y-box.top-box.height/2;if(off<0&&off>closest.offset)closest={offset:off,el};}

}
function wireRepRow(rowEl,autoNext){

function wireRepeat(cont){
  const cols=JSON.parse(cont.dataset.cols||"[]"),autoNext=cont.dataset.autonext==="1",rows=cont.querySelector(".rep-rows"),add=cont.querySelector("[data-repadd]");
  cont.querySelectorAll(".rep-row").forEach(r=>wireRepRow(r,autoNext));
  rows.addEventListener("dragover",e=>{
    if(!DRAG_ROW||DRAG_ROW.parentElement!==rows)return;
    e.preventDefault();e.dataTransfer.dropEffect="move";
    const after=repDragAfter(rows,e.clientY);
    if(after==null)rows.appendChild(DRAG_ROW);else if(after!==DRAG_ROW)rows.insertBefore(DRAG_ROW,after);
  });
  rows.addEventListener("drop",e=>e.preventDefault());
  add.addEventListener("click",()=>{const t=document.createElement("div");t.innerHTML=repRowHTML(cols,{});const row=t.firstElementChild;rows.appendChild(row);wireRepRow(row,autoNext);});

function readPhoto(file,cb){
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{const max=260;let w=img.width,h=img.height;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);try{cb(cv.toDataURL("image/jpeg",0.72));}catch(e){cb(rd.result);}};img.src=rd.result;};
  rd.readAsDataURL(file);
}

async function saveRecord(c,id,isNew,ov){
  const sc=SCHEMA[c],obj={};
  for(const f of sc.fields){
    if(f.type==="group")continue;
    if(f.type==="checkbox"){obj[f.k]=!!$("#f_"+f.k,ov)?.checked;continue;}
    if(f.type==="checks"){f.opts.forEach(([k])=>obj[k]=$("#f_"+k,ov).checked);continue;}
    if(f.type==="multiselect"){obj[f.k]=[...ov.querySelectorAll("#f_"+f.k+" input[data-ms]")].filter(x=>x.checked).map(x=>x.dataset.ms);continue;}
    if(f.type==="repeat"){const cols=f.cols||[];
      obj[f.k]=[...ov.querySelectorAll("#f_"+f.k+" .rep-row")].map(r=>{const o={};cols.forEach(cd=>{const el=r.querySelector('[data-k="'+cd.k+'"]');if(!el)return;o[cd.k]=cd.type==="checkbox"?el.checked:(el.value||null);});return o;})
        .filter(o=>cols.some(cd=>cd.type!=="checkbox"&&o[cd.k]));continue;}
    if(f.type==="photo"){const pf=ov.querySelector("#f_"+f.k);obj[f.k]=pf?(pf.dataset.val||null):null;continue;}
    let val=$("#f_"+f.k,ov).value;
    if(f.type==="number")val=val===""?null:Number(val);
    if(f.type==="url")val=(val||"").trim();
    obj[f.k]=val===""?null:val;
  }
  if(isNew&&["suppliers","contractors","authorizedPersons","aircraft","qaPersonnel","companyCerts","picPersonnel","auditPlan","ncrMonitoring"].includes(c)){const mx=Math.max(0,...(DATA[c]||[]).map(r=>Number(r.no)||0));obj.no=mx+1;}  // auto running No.
  if(SCHEMA[c].planner){const prev=(DATA[c]||[]).find(r=>r._id===id);obj.year=(prev&&prev.year)||PLAN_YEAR||String(new Date().getFullYear());obj.rev=(prev&&prev.rev)||PLAN_REV||"00";
    if(isNew){const peers=(DATA[c]||[]).filter(r=>String(r.year||"")===obj.year&&String(r.rev||"00")===obj.rev&&(r.section||"")===(obj.section||""));
      obj.ord=peers.reduce((mx,r)=>Math.max(mx,Number(r.ord)||0),0)+1;}
    else if(prev&&prev.ord!=null)obj.ord=prev.ord;
  }
  if(c==="suppliers"){
    obj.scope=(obj.scopeClasses||[]).map(x=>"Class "+x).join(", ")||null;   // readable string for search
  }
  if(c==="aircraft"){
    const t=obj.typeModel||"",prev=(DATA.aircraft||[]).find(r=>r._id===id);
    obj.fleet=/A3\d/i.test(t)?"Airbus":/B7\d/i.test(t)?"Boeing":((prev&&prev.fleet)||null);
  }
  const nameField=sc.fields.find(f=>f.req);
  if(nameField&&!obj[nameField.k]){toast("กรุณากรอก: "+nameField.l,true);return;}
  const btn=ov.querySelector("[data-save]");btn.disabled=true;btn.innerHTML='<span class="loader"></span>';
  try{
    obj.updatedAt=Date.now();obj.updatedBy=ME.email;
    if(c==="contractors"){
      const prev=(DATA.contractors||[]).find(x=>x._id===id);
      if(obj.address&&prev&&prev.address===obj.address&&Number.isFinite(Number(prev.geoLat))){
        obj.geoLat=prev.geoLat;obj.geoLng=prev.geoLng;obj.geoCC=prev.geoCC; // unchanged → reuse
      }else if(obj.address){
        const g=await geocodeLocation(obj.address);
        if(g){obj.geoLat=g.lat;obj.geoLng=g.lng;obj.geoCC=g.cc;}
        else{obj.geoLat=null;obj.geoLng=null;obj.geoCC=null;}
      }else{obj.geoLat=null;obj.geoLng=null;obj.geoCC=null;}
    }
    let savedId=id;
    if(isNew){obj.createdAt=Date.now();obj.createdBy=ME.email;const nref=await addDoc(collection(db,c),obj);savedId=nref.id;}
    else await updateDoc(doc(db,c,id),obj);
    await reload(c);
    if(c==="ncrMonitoring")await syncPlanFromNcr((DATA.ncrMonitoring||[]).find(n=>n._id===savedId));
    closeModal();buildNav();setActive();
    if(CURRENT===c){drawTable(c);if(c==="contractors")initContractorMap();}
    toast(isNew?"เพิ่มรายการแล้ว":"บันทึกแล้ว");
  }catch(e){btn.disabled=false;btn.textContent="บันทึก";toast("บันทึกไม่สำเร็จ: "+(e.code||e.message),true);}
}

const MOC_TYPE_EXT=[["reg","Regulatory change"],["econ","Economic change"],["phys","Physical change (e.g. aerodrome layout change)"]];
const MOC_TYPE_INT=[["newtech","Introduction of new technology or equipment"],["openv","Change in the operating environment"],["keyper","Change in key personnel"],["staff","Change in staffing level"],["restruct","Restructuring of the organization"],["policy","Policy or major process change"],["physfac","Physical changes (e.g. new facility or base)"]];
const MOC_IMPACT=[["stake","Stakeholder (internal and external)"],["equip","Equipment and system"],["proc","Process"],["doc","Document"],["risk","Existing risk control"],["train","Training"],["budget","Budget"],["other","Others"]];
const MOC_STATUS=["Open","In Progress","Implemented"];
const MOC_POSS=[["Frequent (5)",5],["Occasional (4)",4],["Remote (3)",3],["Improbable (2)",2],["Extremely Improbable (1)",1]];
const MOC_SEV=[["Catastrophic (A)","A"],["Hazardous (B)","B"],["Major (C)","C"],["Minor (D)","D"],["Negligible (E)","E"]];
const MOC_CAT={I:["Intolerable","#FF0000","#fff"],M:["Management Attention","#ED7D31","#fff"],T:["Tolerable","#FFFF00","#111"],L:["Low","#00B050","#fff"]};
const MOC_MATRIX={"5A":"I","5B":"I","5C":"I","5D":"M","5E":"T","4A":"I","4B":"I","4C":"M","4D":"M","4E":"T","3A":"I","3B":"M","3C":"M","3D":"T","3E":"L","2A":"M","2B":"M","2C":"T","2D":"T","2E":"L","1A":"T","1B":"T","1C":"L","1D":"L","1E":"L"};
function mocPossNum(l){const m=MOC_POSS.find(x=>x[0]===l);return m?m[1]:null;}
function mocSevLet(l){const m=MOC_SEV.find(x=>x[0]===l);return m?m[1]:null;}
function mocCell(poss,sev){const n=mocPossNum(poss),l=mocSevLet(sev);return n&&l?(""+n+l):"";}
function mocCellColor(cell){const cat=MOC_MATRIX[cell];return cat?{bg:MOC_CAT[cat][1],fg:MOC_CAT[cat][2],name:MOC_CAT[cat][0]}:{bg:"",fg:"",name:""};}
function mocId(p){return p+Math.random().toString(36).slice(2,9);}
function _mi(id,val,ph,dis,cls){return `<input id="${id}" value="${esc(val==null?"":String(val))}" placeholder="${esc(ph||"")}" ${dis} class="moc-in ${cls||""}">`;}
function _md(id,val,dis){return `<input type="date" id="${id}" value="${esc(val||"")}" ${dis} class="moc-in">`;}
function _mt(id,val,dis,rows){return `<textarea id="${id}" rows="${rows||2}" ${dis} class="moc-in">${esc(val||"")}</textarea>`;}
function _mcb(id,ck,dis){return `<input type="checkbox" id="${id}" ${ck?"checked":""} ${dis}>`;}
function mocSel(list,val,dis,cls){return `<select class="moc-in ${cls||""}" ${dis}><option value="">—</option>${list.map(([l])=>`<option ${val===l?"selected":""}>${esc(l)}</option>`).join("")}</select>`;}
function mocRateSelect(val,dis){
  const opts=Object.keys(MOC_MATRIX).map(cell=>{const c=mocCellColor(cell);return `<option value="${cell}" ${val===cell?"selected":""} style="background:${c.bg};color:${c.fg}">${cell} — ${c.name}</option>`;}).join("");
  const c=mocCellColor(val);
  return `<select class="moc-in moc-rate" ${dis} style="${c.bg?`background:${c.bg};color:${c.fg};font-weight:700`:""}"><option value="">—</option>${opts}</select>`;}
function mocWireRate(sel){const c=mocCellColor(sel.value);sel.style.background=c.bg;sel.style.color=c.fg;sel.style.fontWeight=c.bg?"700":"";}
function mocStatusSelect(val,dis){return `<select class="moc-in" ${dis}><option value="">—</option>${MOC_STATUS.map(s=>`<option ${val===s?"selected":""}>${s}</option>`).join("")}</select>`;}
function mocStatusTag(r){const s=r.mocStatus||"Open";return tag(s,{Closed:"green",Open:"amber","In Progress":"blue"}[s]||"gray");}

function renderMoc(){

    :`<button class="btn btn-ghost" style="width:auto" id="mocSelToggle">เลือกหลายรายการ</button><button class="btn btn-primary" style="width:auto" id="mocAdd">+ สร้าง MOC</button>`):"";
  v.innerHTML=`<div class="page-head"><div><h1>Management of Change</h1><div class="sub">การบริหารการเปลี่ยนแปลง · TVJ-SSQA-F-028 Rev.03</div></div>
