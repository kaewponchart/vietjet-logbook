    <tbody>${rows.length?rows.map(r=>`<tr class="rowlink" data-moc="${r._id}">
      ${SM?`<td class="c" data-nolink><input type="checkbox" class="moc-sel" value="${r._id}" ${MOC_SEL.has(r._id)?"checked":""}></td>`:""}
      <td class="mono">${esc(r.refNo||"—")}</td><td>${esc(r.changeTitle||"—")}</td>
      <td>${tag(r.priority||"—",{High:"red",Medium:"amber",Low:"gray"}[r.priority]||"gray")}</td>
      <td class="mono">${r.dateOfRequest?fmtDate(r.dateOfRequest):"—"}</td><td>${mocStatusTag(r)}</td></tr>`).join(""):`<tr><td colspan="${SM?6:5}" class="empty">ยังไม่มีรายการ${ADM?" — กด “สร้าง MOC”":""}</td></tr>`}
    </tbody></table></div>`;
  $("#mocAdd")?.addEventListener("click",createMoc);

  v.querySelectorAll("[data-moc]").forEach(tr=>tr.addEventListener("click",e=>{
    if(SM){if(e.target.closest("input"))return;const cb=tr.querySelector(".moc-sel");if(cb){cb.checked=!cb.checked;cb.dispatchEvent(new Event("change"));}return;}
    if(e.target.closest("[data-nolink],input"))return;openMocDetail(tr.dataset.moc);}));
  if(SM){
    const cbs=()=>[...v.querySelectorAll(".moc-sel")];
    const cnt=$("#mocBulkN"),all=$("#mocSelAll");
    const sync=()=>{MOC_SEL=new Set(cbs().filter(x=>x.checked).map(x=>x.value));cnt.textContent=`เลือกไว้ ${MOC_SEL.size} รายการ`;
      if(all){all.checked=cbs().length>0&&MOC_SEL.size===cbs().length;all.indeterminate=MOC_SEL.size>0&&MOC_SEL.size<cbs().length;}};
    cbs().forEach(cb=>cb.addEventListener("change",sync));
    all?.addEventListener("change",()=>{cbs().forEach(cb=>cb.checked=all.checked);sync();});
    $("#mocDelSel")?.addEventListener("click",()=>{
      const ids=[...MOC_SEL];if(!ids.length){toast("ยังไม่ได้เลือกรายการ",true);return;}
      confirmModal(`ลบ MOC ที่เลือก ${ids.length} รายการ?`,"การลบนี้ย้อนกลับไม่ได้",async()=>{
        try{await Promise.all(ids.map(id=>deleteDoc(doc(db,"moc",id))));await reload("moc");closeModal();MOC_SELMODE=false;MOC_SEL=new Set();buildNav();renderMoc();toast(`ลบ ${ids.length} รายการแล้ว`);}
        catch(e){toast("ลบไม่สำเร็จ: "+(e.code||e.message),true);closeModal();}
      });
    });
    sync();
  }
}

function mocWireRow(tr,v){ // auto-calc rating from poss+sev
  const calc=()=>{const p=tr.querySelector(".moc-poss,.moc-rposs")?.value,s=tr.querySelector(".moc-sev,.moc-rsev")?.value;const cell=mocCell(p,s);const rt=tr.querySelector(".moc-rate");if(rt&&cell){rt.value=cell;mocWireRate(rt);}};
  tr.querySelectorAll(".moc-poss,.moc-sev,.moc-rposs,.moc-rsev").forEach(sel=>sel.addEventListener("change",calc));
  const rt=tr.querySelector(".moc-rate");if(rt){mocWireRate(rt);rt.addEventListener("change",()=>mocWireRate(rt));}

function openMocDetail(id){

    <p style="font-size:11.5px;color:var(--faint);margin-top:8px">* Action/Owner ดึงจาก Part II · หากทุก Mitigation มีสถานะ Implemented ระบบจะตั้ง MOC เป็น Closed อัตโนมัติเมื่อบันทึก</p>

  v.innerHTML=`<div class="page-head"><div><h1>${esc(r.refNo||"MOC")}</h1><div class="sub">${esc(r.changeTitle||"—")} · ${mocStatusTag(r)}</div></div>
    <div class="page-actions"><button class="btn btn-ghost" style="width:auto" id="mocBack">← กลับ</button><button class="btn btn-ghost" style="width:auto" id="mocExport">Export PDF</button>${ADM?`<button class="btn btn-primary" style="width:auto" id="mocSave">บันทึกทั้งหมด</button>`:""}</div></div>

async function saveMoc(id,v){
  const val=x=>{const el=v.querySelector(x);return el?el.value.trim():"";};
  const ck=x=>{const el=v.querySelector(x);return el?el.checked:false;};
  const typeExt={otherText:val("#mte_other_t"),other:ck("#mte_other")};MOC_TYPE_EXT.forEach(([k])=>typeExt[k]=ck("#mte_"+k));
  const typeInt={otherText:val("#mti_other_t"),other:ck("#mti_other")};MOC_TYPE_INT.forEach(([k])=>typeInt[k]=ck("#mti_"+k));
  const impact={};MOC_IMPACT.forEach(([k])=>impact[k]={on:ck("#mim_"+k),text:val("#mimt_"+k)});
  const hazards=[...v.querySelectorAll(".moc-hrow")].map(tr=>{
    const hid=tr.dataset.hid;const tas=tr.querySelectorAll("textarea");
    const req=tr.querySelector(`input[name="mreq_${hid}"]:checked`);
    return {hid,hazard:(tas[0]||{}).value?.trim()||"",consequence:(tas[1]||{}).value?.trim()||"",existingControls:(tas[2]||{}).value?.trim()||"",
      possibility:tr.querySelector(".moc-poss")?.value||"",severity:tr.querySelector(".moc-sev")?.value||"",rating:tr.querySelector(".moc-rate")?.value||"",mitigationReq:req?req.value:""};
  }).filter(h=>h.hazard||h.consequence||h.rating);
  const mits=[];
  v.querySelectorAll("#mocMitGroups .moc-hgroup").forEach(g=>{const hid=g.dataset.hid;
    g.querySelectorAll(".moc-mrow").forEach(tr=>{const ta=tr.querySelector("textarea");const owner=tr.querySelector('input.moc-in:not([type="date"])');const due=tr.querySelector('input[type="date"]');
      const action=ta?ta.value.trim():"";if(action||owner&&owner.value.trim())mits.push({mid:tr.dataset.mid,hid,action,owner:owner?owner.value.trim():"",dueDate:(due&&due.value)||null});});
  });
  const followups={};
  v.querySelectorAll(".moc-frow").forEach(tr=>{const mid=tr.dataset.mid;const dt=tr.querySelector('input[type="date"]');const sels=tr.querySelectorAll("select");const rec=tr.querySelector("textarea");
    followups[mid]={followupDate:(dt&&dt.value)||null,status:(tr.querySelector("select:not(.moc-rposs):not(.moc-rsev):not(.moc-rate)")||{}).value||"",
      resPossibility:tr.querySelector(".moc-rposs")?.value||"",resSeverity:tr.querySelector(".moc-rsev")?.value||"",resRating:tr.querySelector(".moc-rate")?.value||"",
      recommendation:rec?rec.value.trim():""};
  });
  // auto status: all active mitigations Implemented → Closed
  const active=mits.filter(m=>m.action&&m.action.trim());
  let mocStatus="Open";
  if(active.length){
    const allImpl=active.every(m=>(followups[m.mid]||{}).status==="Implemented");
    const anyProg=active.some(m=>{const st=(followups[m.mid]||{}).status;return st==="Implemented"||st==="In Progress";});
    mocStatus=allImpl?"Closed":(anyProg?"In Progress":"Open");
  }
  const obj={
    refNo:val("#m_refNo"),revNo:val("#m_revNo"),dateOfRequest:val("#m_dor")||null,implDate:val("#m_impl")||null,
    changeTitle:val("#m_title"),description:val("#m_desc"),typeExt,typeInt,impact,
    priority:(v.querySelector('input[name="mocPriority"]:checked')||{}).value||"",
    mocTeam:val("#m_team"),
    mocStatus,
    hazards,mitigations:mits,followups,
    updatedAt:Date.now(),updatedBy:ME.email
  };
  const btn=v.querySelector("#mocSave");if(btn){btn.disabled=true;btn.innerHTML='<span class="loader"></span>';}
  try{await updateDoc(doc(db,"moc",id),obj);await reload("moc");buildNav();openMocDetail(id);toast("บันทึก MOC แล้ว");}
  catch(e){toast("บันทึกไม่สำเร็จ: "+(e.code||e.message),true);if(btn){btn.disabled=false;btn.textContent="บันทึกทั้งหมด";}}
}

    </div>

function oldAddMonths(iso,n){const d=new Date(iso+"T00:00:00");if(isNaN(d))return"";d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10);}
async function fixAutoDates(){
  const report=[];let fixed=0,scanned=0;
  // 1) MNT Contractors: nextMonitor from lastMonitor (+24 Onsite / +12 Remote)
  for(const r of (DATA.contractors||[])){
    if(!r.lastMonitor||!(r.typeOfAudit==="Onsite Audit"||r.typeOfAudit==="Remote Audit"))continue;
    scanned++;
    const n=r.typeOfAudit==="Onsite Audit"?24:12;
    const expNew=addMonths(r.lastMonitor,n),expOld=oldAddMonths(r.lastMonitor,n);
    if(expOld!==expNew&&r.nextMonitor===expOld){
      await updateDoc(doc(db,"contractors",r._id),{nextMonitor:expNew,updatedBy:"auto",updatedAt:Date.now()});
      r.nextMonitor=expNew;fixed++;report.push(`Contractor ${r.name||r._id}: Next monitor → ${fmtDate(expNew)}`);
    }
  }
  // 2) QA Personnel: auditorValidationNextDue (+24) และ courses[].nextDue (+24)
  for(const r of (DATA.qaPersonnel||[])){
    const patch={};
    if(r.auditorValidationIssue){
      scanned++;
      const expNew=addMonths(r.auditorValidationIssue,24),expOld=oldAddMonths(r.auditorValidationIssue,24);
      if(expOld!==expNew&&r.auditorValidationNextDue===expOld){patch.auditorValidationNextDue=expNew;report.push(`QA ${r.name||r._id}: Auditor Validation → ${fmtDate(expNew)}`);}
    }
    if(Array.isArray(r.courses)){
      let chg=false;
      const courses=r.courses.map(cs=>{
        if(cs&&cs.lastDone&&!cs.noNext){
          scanned++;
          const expNew=addMonths(cs.lastDone,24),expOld=oldAddMonths(cs.lastDone,24);
          if(expOld!==expNew&&cs.nextDue===expOld){chg=true;report.push(`QA ${r.name||r._id} · ${cs.course||"course"}: Next due → ${fmtDate(expNew)}`);return{...cs,nextDue:expNew};}
        }
        return cs;
      });
      if(chg)patch.courses=courses;
    }
    if(Object.keys(patch).length){patch.updatedBy="auto";patch.updatedAt=Date.now();await updateDoc(doc(db,"qaPersonnel",r._id),patch);Object.assign(r,patch);fixed+=(patch.courses?1:0)+(patch.auditorValidationNextDue?1:0);}
  }
  return{fixed,scanned,report};
}

      <table><thead><tr><th class="nosort" style="width:44px"></th><th class="nosort">Collection</th><th class="nosort">ในไฟล์ seed</th><th class="nosort">ใน Firestore ตอนนี้</th><th class="nosort">สถานะ</th></tr></thead><tbody>
      ${seed?cols.map(c=>{const has=cur[c]>0;
        const status=has?`<span class="tag amber">มีข้อมูลแล้ว ${cur[c]} — ติ๊กเพื่อเพิ่มทับ (อาจซ้ำ)</span>`:'<span class="tag green">ว่าง พร้อมนำเข้า</span>';
        return`<tr><td class="c"><input type="checkbox" class="seed-chk" data-c="${c}" ${has?"":"checked"} style="width:16px;height:16px;accent-color:var(--brand)"></td><td class="name">${esc(SCHEMA[c].label)}</td><td class="mono">${counts[c]}</td><td class="mono">${cur[c]}</td><td>${status}</td></tr>`;}).join(""):`<tr><td colspan="5" class="empty">ไม่พบ seed-data.js — ตรวจสอบว่าไฟล์อยู่ใน public/ ร่วมกับ index.html</td></tr>`}
      </tbody></table></div>
      <div style="padding:16px;border-top:1px solid var(--line-2)">
        <button class="btn btn-primary" style="width:auto" id="seedBtn" ${seed&&cols.length?"":"disabled"}>นำเข้าที่เลือก</button>
        <div id="seedMsg" style="margin-top:12px"></div>
      </div>
    </div>
    <div class="panel"><div class="panel-head"><h2>นำเข้าจากไฟล์ CSV (อัปโหลด)</h2></div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:12px;max-width:640px">
        <div class="field"><label>เลือกหมวดปลายทาง</label><select id="csvColl">${Object.keys(SCHEMA).map(c=>`<option value="${c}">${esc(SCHEMA[c].label)}</option>`).join("")}</select></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <button class="btn btn-ghost" style="width:auto" id="csvTmpl">⬇ ดาวน์โหลดเทมเพลต CSV</button>
          <input type="file" id="csvFile" accept=".csv,text/csv" style="flex:1;min-width:180px">
          <button class="btn btn-primary" style="width:auto" id="csvImport">อัปโหลด &amp; นำเข้า</button>
        </div>
        <p style="font-size:12px;color:var(--muted);line-height:1.7;margin:0">
          • หัวคอลัมน์ให้ตรงกับชื่อฟิลด์ — กด “ดาวน์โหลดเทมเพลต CSV” เพื่อดูรูปแบบที่ถูกต้อง<br>
          • วันที่: ใช้ <b>YYYY-MM-DD</b> หรือ <b>15 Jun 26</b> · หลายค่า (multiselect): คั่นด้วย , หรือ ; เช่น <b>VJC; VNA</b><br>
          • การนำเข้าเป็นการ “เพิ่ม” ต่อจากข้อมูลเดิม (ไม่ลบของเก่า) — ตรวจไฟล์ก่อนอัปโหลด
        </p>
        <div id="csvMsg"></div>
      </div>
    </div>
    <div class="panel"><div class="panel-head"><h2>🔧 ซ่อมวันที่คำนวณอัตโนมัติ (แก้ค่าเก่าที่คลาดเคลื่อน 1 วัน)</h2></div>
      <div style="padding:16px;max-width:640px">
        <p style="font-size:13px;color:var(--ink-2);line-height:1.7;margin:0 0 12px">
          ไล่ตรวจวันที่ที่ระบบเคยคำนวณให้ (Next monitor ของ MNT Contractors, Auditor Validation Next Due และ Training Next Due ของ QA Personnel)
          หากพบค่าที่ตรงกับผลของสูตรเดิมที่คลาดเคลื่อน −1 วัน จะแก้เป็นค่าที่ถูกต้องให้อัตโนมัติ
          <b>รายการที่ผู้ใช้แก้วันที่เองจะไม่ถูกแตะต้อง</b></p>
        <button class="btn btn-primary" style="width:auto" id="fixDatesBtn">ตรวจ &amp; ซ่อมวันที่</button>
        <div id="fixMsg" style="margin-top:12px"></div>
      </div>
    </div>`;
  // ---- repair wiring ----
  $("#fixDatesBtn")?.addEventListener("click",async()=>{
    const btn=$("#fixDatesBtn"),msg=$("#fixMsg");
    btn.disabled=true;btn.innerHTML='<span class="loader"></span> กำลังตรวจ...';
    try{
      const res=await fixAutoDates();
      msg.className="msg ok";
      msg.innerHTML=res.fixed?`ซ่อมแล้ว ${res.report.length} จุด:<br><div style="font-size:12px;color:var(--muted);margin-top:6px;line-height:1.8">${res.report.map(x=>"• "+esc(x)).join("<br>")}</div>`
        :`ตรวจ ${res.scanned} จุดแล้ว — ไม่พบค่าที่ต้องซ่อม ✓`;
      btn.disabled=false;btn.textContent="ตรวจ & ซ่อมวันที่";
      if(res.fixed){await loadAll();buildNav();}
    }catch(e){msg.className="msg err";msg.textContent="ซ่อมไม่สำเร็จ: "+(e.code||e.message);btn.disabled=false;btn.textContent="ตรวจ & ซ่อมวันที่";}
  });
  // ---- CSV upload wiring ----
  const CSV_SKIP=["repeat","photo","checks","group"];
  $("#csvTmpl")?.addEventListener("click",()=>{const c=$("#csvColl").value,fs=(SCHEMA[c].fields||[]).filter(f=>f.k&&!CSV_SKIP.includes(f.type));downloadCSV(`${SCHEMA[c].label}_template.csv`,[fs.map(f=>f.l)]);});
  $("#csvImport")?.addEventListener("click",()=>{
    const c=$("#csvColl").value,fileEl=$("#csvFile"),msg=$("#csvMsg"),file=fileEl.files&&fileEl.files[0];
    if(!file){msg.className="msg err";msg.textContent="ยังไม่ได้เลือกไฟล์ CSV";return;}
    const rd=new FileReader();
    rd.onload=async()=>{
      try{
        const rows=parseCSV(rd.result);
        if(rows.length<2){msg.className="msg err";msg.textContent="ไฟล์ว่างหรือมีแต่หัวคอลัมน์";return;}
        const recs=csvToRecords(c,rows);
        if(!recs.length){msg.className="msg err";msg.textContent="ไม่พบข้อมูลที่นำเข้าได้ — ตรวจว่าหัวคอลัมน์ตรงกับชื่อฟิลด์";return;}
        if(!confirm(`นำเข้า ${recs.length} รายการ เข้าสู่ “${SCHEMA[c].label}” ?\n(เป็นการเพิ่มต่อจากข้อมูลเดิม)`))return;
        const btn=$("#csvImport");btn.disabled=true;let done=0;
        const autoNo=["suppliers","contractors","authorizedPersons","aircraft","qaPersonnel","companyCerts","picPersonnel","auditPlan","ncrMonitoring"].includes(c);
        let base=Math.max(0,...(DATA[c]||[]).map(r=>Number(r.no)||0));
        for(let i=0;i<recs.length;i+=400){const batch=writeBatch(db);
          for(const rec of recs.slice(i,i+400)){if(autoNo&&!rec.no)rec.no=++base;if(SCHEMA[c].planner){rec.year=rec.year||PLAN_YEAR||String(new Date().getFullYear());rec.rev=rec.rev||"00";}const ref=doc(collection(db,c));batch.set(ref,{...rec,importedAt:Date.now()});done++;}
          await batch.commit();btn.innerHTML=`<span class="loader"></span> ${done}/${recs.length}`;}
        msg.className="msg ok";msg.textContent=`นำเข้าสำเร็จ ${recs.length} รายการ`;
        await loadAll();buildNav();btn.disabled=false;btn.textContent="อัปโหลด & นำเข้า";fileEl.value="";
      }catch(e){msg.className="msg err";msg.textContent="นำเข้าไม่สำเร็จ: "+(e.code||e.message);}
    };
    rd.readAsText(file,"UTF-8");
  });
  if(!seed||!cols.length)return;
  const allBox=$("#seedAll");
  allBox?.addEventListener("change",()=>{v.querySelectorAll(".seed-chk").forEach(x=>x.checked=allBox.checked);});
  const btn=$("#seedBtn");
  btn.addEventListener("click",async()=>{
    const sel=[...v.querySelectorAll(".seed-chk")].filter(x=>x.checked).map(x=>x.dataset.c);
    const msg=$("#seedMsg");
    if(!sel.length){msg.className="msg err";msg.textContent="ยังไม่ได้เลือกหมวดที่จะนำเข้า";return;}
    const hasData=sel.filter(c=>cur[c]>0);
    if(hasData.length&&!confirm(`หมวดต่อไปนี้มีข้อมูลอยู่แล้ว: ${hasData.map(c=>SCHEMA[c].label).join(", ")}\nการนำเข้าจะ "เพิ่มทับ" ข้อมูลเดิม (อาจเกิดรายการซ้ำ)\nต้องการดำเนินการต่อหรือไม่?`))return;
    btn.disabled=true;
    let done=0;const total=sel.reduce((s,c)=>s+seed[c].length,0);
    try{
      for(const c of sel){
        const arr=seed[c];
        for(let i=0;i<arr.length;i+=400){
          const batch=writeBatch(db);
          for(const rec of arr.slice(i,i+400)){const ref=doc(collection(db,c));batch.set(ref,{...rec,importedAt:Date.now()});done++;}
          await batch.commit();
          btn.innerHTML=`<span class="loader"></span> ${done}/${total}`;
        }
      }
      msg.className="msg ok";msg.textContent=`นำเข้าสำเร็จ ${total} รายการ (${sel.map(c=>SCHEMA[c].label).join(", ")})`;
      await loadAll();buildNav();
      btn.textContent="นำเข้าเสร็จแล้ว ✓";
    }catch(e){btn.disabled=false;btn.textContent="ลองอีกครั้ง";msg.className="msg err";msg.textContent="นำเข้าไม่สำเร็จ: "+(e.code||e.message)+" — ตรวจสอบ Firestore Security Rules";}
  });
}

/* ---------- mobile sidebar ---------- */
function closeSide(){$("#side").classList.remove("open");const s=document.querySelector(".scrim");if(s)s.remove();}
$("#menuBtn")?.addEventListener("click",()=>{
  const side=$("#side");side.classList.add("open");
  const scrim=document.createElement("div");scrim.className="scrim";scrim.addEventListener("click",closeSide);document.querySelector(".main").appendChild(scrim);
});
$("#sideCollapse")?.addEventListener("click",()=>$("#app").classList.add("side-collapsed"));
$("#sideExpand")?.addEventListener("click",()=>$("#app").classList.remove("side-collapsed"));
</script>
</body>
</html>
